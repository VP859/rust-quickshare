[package]
name = "ferry-cli"
description = "Ferry command line tool, terminal UI and background daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["file-sharing", "p2p", "quic", "lan", "cli"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[lints]
workspace = true

# The binary keeps the name users type. Its documentation would overwrite the
# library's (both are called `ferry`), so `cargo doc` skips it; CI checks it with
# `cargo rustdoc -p ferry-cli --bin ferry`.
[[bin]]
name = "ferry"
path = "src/main.rs"
doc = false

[dependencies]
ferry = { path = ".." }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
iroh = { workspace = true }
clap = { version = "4.6.7", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
indicatif = "0.18.6"
ratatui = "0.30.2"
crossterm = "0.29.0"
qrcode = { version = "0.14.1", default-features = false }
dirs = "7.0.0"
rust-i18n = "4.2.4"
# Probe file when the daemon checks its download folder.
tempfile = "3.27.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
# System clipboard (copying the TICKET and received texts), desktop only.
arboard = "3.7.0"
# Network interfaces for `ferry doctor`.
network-interface = "2.0.5"

tempfile = "3.27.0"
