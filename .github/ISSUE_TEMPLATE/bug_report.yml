name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems must **not** be reported here – see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Ferry on both devices
        2. ...
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      multiple: true
      options: [GUI (desktop), GUI (Android), TUI, CLI, Daemon]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ferry version
      description: Output of `ferry --version` or Settings → Application in the GUI.
    validations:
      required: true
  - type: input
    id: platforms
    attributes:
      label: Operating systems of both devices
      placeholder: Fedora 44 → Android 17
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network mode
      options: [local (default), internet]
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ferry doctor`
      description: Remove anything you consider private.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`RUST_LOG=debug ferry ...` or on Android `adb logcat -s FerryCore FerryService FerryShare`."
      render: text
