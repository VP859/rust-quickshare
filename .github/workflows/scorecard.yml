# OpenSSF Scorecard (https://scorecard.dev): automated checks of the project's
# security practices – pinned actions, token permissions, branch protection,
# dependency updates, fuzzing, signed releases and more.
#
# The results stay on GitHub: a SARIF report as a workflow artifact and, once
# the repository is public, in the Security tab (code scanning). Nothing is
# sent to the public Scorecard API (`publish_results: false`); setting it to
# true (with `id-token: write`) adds the project to scorecard.dev and allows
# its badge.

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mondays
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
      security-events: write # upload the report to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the checks
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 30
      # Code scanning in private repositories needs GitHub Advanced Security.
      - name: Show the results in the Security tab
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
