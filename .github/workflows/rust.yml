# Checks every push to main and every pull request. Read-only: CI never pushes
# commits; formatting problems fail the build instead of being fixed silently.
#
# Third-party actions are pinned to commit SHAs (Dependabot keeps them current).

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Minimum supported Rust version, keep in sync with `rust-version` in Cargo.toml.
  MSRV: "1.91"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Clippy and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The GUI crate (src-tauri) needs WebKitGTK and the other Tauri libraries.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      # rust-toolchain.toml selects stable, so the MSRV is requested explicitly.
      - run: cargo +${{ env.MSRV }} check --workspace --all-targets --locked

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: rustdoc (public and private items)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps --document-private-items --locked
          cargo rustdoc -p ferry-cli --bin ferry --locked -- -D warnings --document-private-items

  android:
    name: Android (aarch64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The runner image ships an NDK in $ANDROID_NDK_LATEST_HOME.
      - name: Clippy for Android
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android24-clang"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo clippy -p ferry -p ferry-gui --target aarch64-linux-android --locked -- -D warnings

  coverage:
    name: Test coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      # The library holds everything that handles data from other devices;
      # the threshold stops coverage from silently going down.
      - name: Coverage of the library (at least 78 % of lines)
        run: cargo llvm-cov -p ferry --locked --fail-under-lines 78 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  network:
    name: Bad network conditions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Loss, delay, a network change and long outages through the forwarder in
      # the test itself, including the tests that wait for the QUIC idle timeout.
      - name: Simulated link (loss, network change, outages)
        run: cargo test -p ferry --locked --release --test network_conditions -- --include-ignored
      # The same end-to-end tests as usual, but with the kernel dropping and
      # delaying packets on loopback (tc netem).
      - name: End-to-end tests over a lossy loopback (tc netem)
        run: |
          sudo tc qdisc add dev lo root netem delay 5ms 2ms loss 1%
          cargo test -p ferry --locked --release --test integration_tests
      - name: Remove netem
        if: always()
        run: sudo tc qdisc del dev lo root || true

  benchmarks:
    name: Performance against the base branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../bench-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Both revisions run on the same machine, one after the other, so they
      # are compared under the same conditions.
      - name: Benchmarks of the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git worktree add ../base "origin/$BASE"
          cd ../base
          cargo bench --bench transfer_benchmarks -- --save-baseline base
      - name: Benchmarks of this change
        run: cargo bench --bench transfer_benchmarks -- --baseline base
      - name: Compare (fails when a benchmark is clearly over 15 % slower)
        run: node scripts/bench-compare.mjs "$CARGO_TARGET_DIR/criterion" 15

  dependencies:
    name: Licenses and advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  frontend:
    name: GUI frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install development tools (Biome, Playwright)
        run: npm ci
      - name: JavaScript syntax and translation keys
        run: npm run check:ui
      - name: Lint (Biome)
        run: npm run lint:ui
      - name: Browser tests (Playwright, mocked Tauri API)
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
