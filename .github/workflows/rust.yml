# Checks every push to main and every pull request. Read-only: CI never pushes
# commits; formatting problems fail the build instead of being fixed silently.
#
# Third-party actions are pinned to commit SHAs (Dependabot keeps them current).

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
  # Minimum supported Rust version, keep in sync with `rust-version` in Cargo.toml.
  MSRV: "1.91"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Clippy and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The GUI crate (src-tauri) needs WebKitGTK and the other Tauri libraries.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # The outage and network-change tests are ignored on Windows, where they
      # stopped on CI runners for a reason not found yet (they pass on Linux).
      # This step runs them anyway without failing the build; on a timeout
      # they print a progress timeline and the QUIC logs (docs/TESTING.md).
      - name: Network-condition tests on Windows (diagnostics, allowed to fail)
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          RUST_LOG: info,iroh::socket=debug,noq_proto::connection=debug
        run: cargo test -p ferry --locked --test network_conditions -- --include-ignored --test-threads 1 transfer_survives
      # LocalSend compatibility mode against an independent client written
      # from the LocalSend specification (scripts/localsend-client.py).
      - name: LocalSend client (Python, from the specification)
        if: runner.os == 'Linux'
        run: cargo test -p ferry --locked --test localsend -- --include-ignored the_independent_python_client

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      # rust-toolchain.toml selects stable, so the MSRV is requested explicitly.
      - run: cargo +${{ env.MSRV }} check --workspace --all-targets --locked

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: rustdoc (public and private items)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps --document-private-items --locked
          cargo rustdoc -p ferry-cli --bin ferry --locked -- -D warnings --document-private-items

  android:
    name: Android (aarch64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The runner image ships an NDK in $ANDROID_NDK_LATEST_HOME.
      - name: Clippy for Android
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android24-clang"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo clippy -p ferry -p ferry-gui --target aarch64-linux-android --locked -- -D warnings

  android-apk:
    name: Android APK (debug build)
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-apk
      # gen/android/buildSrc (BuildTask.kt) calls `cargo tauri`, so tauri-cli from crates.io is required.
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      # The only job that compiles the Kotlin code and the Gradle project, so
      # Android and Kotlin updates are checked before they reach a release.
      - name: Build the debug APK (Kotlin, Gradle, Rust for arm64)
        working-directory: src-tauri
        run: cargo tauri android build --ci --debug --apk --target aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferry-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Test coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      # The library holds everything that handles data from other devices;
      # the threshold stops coverage from silently going down.
      - name: Coverage of the library (at least 78 % of lines)
        run: cargo llvm-cov -p ferry --locked --fail-under-lines 78 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  network:
    name: Bad network conditions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Loss, delay, a network change and long outages through the forwarder in
      # the test itself, including the tests that wait for the QUIC idle timeout.
      - name: Simulated link (loss, network change, outages)
        run: cargo test -p ferry --locked --release --test network_conditions -- --include-ignored
      # The same end-to-end tests as usual, but with the kernel dropping and
      # delaying packets on loopback (tc netem).
      - name: End-to-end tests over a lossy loopback (tc netem)
        run: |
          sudo tc qdisc add dev lo root netem delay 5ms 2ms loss 1%
          cargo test -p ferry --locked --release --test integration_tests
      - name: Remove netem
        if: always()
        run: sudo tc qdisc del dev lo root || true

  benchmarks:
    name: Performance against the base branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../bench-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Both revisions run on the same machine, one after the other, so they
      # are compared under the same conditions.
      - name: Benchmarks of the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git worktree add ../base "origin/$BASE"
          cd ../base
          cargo bench --bench transfer_benchmarks -- --save-baseline base
      - name: Benchmarks of this change
        run: cargo bench --bench transfer_benchmarks -- --baseline base
      - name: Compare (fails when a benchmark is clearly over 15 % slower)
        run: node scripts/bench-compare.mjs "$CARGO_TARGET_DIR/criterion" 15

  vectors:
    name: Protocol vectors (independent check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Written only from docs/PROTOCOL.md, without Ferry code: when it passes, the
      # specification is enough to build a compatible implementation.
      - name: Verify docs/protocol-vectors.json with scripts/verify-vectors.py
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet blake3==1.0.11 cryptography==50.0.2
          "$RUNNER_TEMP/venv/bin/python" scripts/verify-vectors.py
      # "Send with Ferry" for Nautilus, with stand-ins for its Python bindings.
      - name: Nautilus extension
        run: python3 -I tests/integration/test_nautilus_extension.py
      - name: Dolphin service menu and Nemo action (syntax)
        run: |
          python3 - <<'PY'
          import configparser
          for path, group, key in [
              ("dist/integration/ferry-send.desktop", "Desktop Action sendWithFerry", "Exec"),
              ("dist/integration/ferry-send.nemo_action", "Nemo Action", "Exec"),
          ]:
              parser = configparser.ConfigParser(interpolation=None, strict=True)
              parser.optionxform = str
              parser.read(path, encoding="utf-8")
              assert parser[group][key] == "ferry-gui -- %F", (path, parser[group][key])
              print("ok ", path)
          PY

  dependencies:
    name: Licenses and advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  frontend:
    name: GUI frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install development tools (Biome, Playwright)
        run: npm ci
      - name: JavaScript syntax and translation keys
        run: npm run check:ui
      - name: Lint (Biome)
        run: npm run lint:ui
      - name: Browser tests (Playwright, mocked Tauri API)
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
