# Fuzzing of everything Ferry parses from other devices (see fuzz/README.md):
# a short run for changes to the parsing code, a long one every week.

name: Fuzz

on:
  pull_request:
    paths: ["src/**", "fuzz/**", "Cargo.lock"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [frame, offer, ticket, file_name, announcement]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz
      - name: Run for ${{ github.event_name == 'pull_request' && '1' || '15' }} minute(s)
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'pull_request' && '60' || '900' }}
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=$SECONDS_TO_RUN -rss_limit_mb=2048
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
