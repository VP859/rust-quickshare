# Fuzzing of everything Ferry parses from other devices (see fuzz/README.md):
# a short run for changes to the parsing code, a long one every week.

name: Fuzz

on:
  pull_request:
    paths: ["src/**", "fuzz/**", "Cargo.lock"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [frame, offer, ticket, file_name, announcement]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-fuzz
      - name: Run for ${{ github.event_name == 'pull_request' && '1' || '15' }} minute(s)
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'pull_request' && '60' || '900' }}
        # The prebuilt cargo-fuzz is a musl binary and would default to the musl
        # target, where the address sanitizer cannot work (static libc).
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu
          -- -max_total_time=$SECONDS_TO_RUN -rss_limit_mb=2048
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
