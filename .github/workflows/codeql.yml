# CodeQL: static analysis (SAST) of every push and pull request, and weekly
# with new queries. Results appear in the Security tab (code scanning).
#
#  rust                  – the library, the CLI and the GUI backend
#  javascript-typescript – the GUI frontend and the browser session page
#  python                – scripts/ and the Nautilus extension
#  actions               – the workflows themselves
#
# No build is needed: every language is analysed from its source
# (`build-mode: none`).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 2" # Tuesdays
  workflow_dispatch:

permissions: read-all

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Vendored third-party code is not ours to analyse.
          config: |
            paths-ignore:
              - src/web/page/vendor
              - node_modules
              - target
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
