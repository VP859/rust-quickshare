[workspace]
members = [
    ".",
    "src-tauri"
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.53.3", features = ["full", "test-util"] }
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
iroh = "1.3.0"
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }

[package]
name = "rqs_p2p"
version = "0.1.0"
edition = "2024"

[lib]
name = "rqs_p2p"
path = "src/lib.rs"

[[bin]]
name = "rqs"
path = "src/main.rs"

[dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
postcard = { version = "1.1.3", features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.23.1"
blake3 = { workspace = true }
indicatif = "0.18.6"
ratatui = "0.30.2"
crossterm = "0.29.0"
dirs = "7.0.0"
toml = "1.1.8"
arboard = "3.7.0"
memmap2 = "0.9.11"
network-interface = "2.0.5"
thiserror = "2.0.21"
tempfile = "3.27.0"
tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
iroh = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[[bench]]
name = "transfer_benchmarks"
harness = false