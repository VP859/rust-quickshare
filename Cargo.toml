[workspace]
members = [
    ".",
    "src-tauri"
]
resolver = "2"

[package]
name = "rqs_p2p"
version = "0.1.0"
edition = "2024"

[lib]
name = "rqs_p2p"
path = "src/lib.rs"

[[bin]]
name = "rqs"
path = "src/main.rs"

[dependencies]
iroh = "1.3.0"
tokio = { version = "1.53.3", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.23.1"
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
indicatif = "0.18.6"
ratatui = "0.30.2"
crossterm = "0.29.0"
dirs = "7.0.0"
toml = "1.1.8"
chrono = { version = "0.4.45", features = ["serde"] }
arboard = "3.6.1"
uuid = { version = "1.28.0", features = ["v4"] }
memmap2 = "0.9.11"
network-interface = "2.0.5"
thiserror = "2.0.21"
tempfile = "3.27.0"