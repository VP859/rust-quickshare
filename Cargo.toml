[workspace]
members = [
    ".",
    "cli",
    "src-tauri"
]
# Built with nightly by `cargo fuzz`, see fuzz/README.md.
exclude = ["fuzz"]
resolver = "2"

# Shared by all crates; the version is the single source for the CLI, the GUI
# and (through scripts/set-version.sh) tauri.conf.json.
[workspace.package]
version = "0.2.3"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VP859/rust-quickshare"
authors = ["VP859 and the Ferry contributors"]

[workspace.lints.rust]
missing_docs = "warn"
# `unsafe` is only allowed in the FFI modules that opt in explicitly.
unsafe_code = "deny"

[workspace.lints.clippy]
missing_docs_in_private_items = "warn"
missing_errors_doc = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
iroh = "1.4.1"
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }

[package]
name = "ferry"
description = "Secure peer-to-peer file sharing over QUIC: the core library of Ferry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["file-sharing", "p2p", "quic", "lan", "airdrop"]
categories = ["network-programming"]
# Not published to crates.io until the library API is stabilized.
publish = false

[lints]
workspace = true

[lib]
name = "ferry"
path = "src/lib.rs"

[features]
# Entry points for the fuzz targets in fuzz/ (never enabled in builds).
fuzzing = []

# The `ferry` binary (CLI, TUI, daemon) is the `ferry-cli` crate in cli/, the
# desktop and Android app the `ferry-gui` crate in src-tauri/.

[dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
# Zero-copy chunk buffers handed to QUIC streams (already used by iroh).
bytes = "1.12.1"
base64 = "0.23.1"
blake3 = { workspace = true }
# OS random numbers for the pairing nonces (already used by iroh and tempfile).
getrandom = "0.4.3"
dirs = "7.0.0"
toml = "1.1.8"
tokio = { workspace = true }
# Free disk space, checked before accepting a file (pure Rust, no libc).
fs4 = "1.1.0"
# CancellationToken for cancelling transfers (already used by iroh).
tokio-util = "0.7.20"
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
iroh = { workspace = true }
# BBRv3 congestion control for the QUIC connections (the QUIC library iroh
# uses; must stay the version iroh depends on). See node::engine::transport_config.
noq-proto = "1.4.0"
socket2 = { version = "0.6.5", features = ["all"] }
gethostname = "1.1.0"
rust-i18n = "4.2.4"

# ---------------------------------------------------------------------------
# Platform-specific dependencies (the Android NDK has no X11/Wayland
# or raw netlink sockets, so these crates are compiled conditionally)
# ---------------------------------------------------------------------------
[target.'cfg(not(target_os = "android"))'.dependencies]
# Network interface enumeration via getifaddrs/netlink, desktop only
network-interface = "2.0.5"

[target.'cfg(target_os = "android")'.dependencies]
# getifaddrs: interface addresses and netmasks for local network discovery.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Tests of the Android getifaddrs code (glibc provides the same API).
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
# Property-based tests (tests/properties.rs and unit tests of limits).
proptest = "1.12.0"
# tests/network_conditions.rs pins connections to a lossy link with a custom
# path selector; dev-dependency features never reach release builds.
iroh = { workspace = true, features = ["unstable-custom-transports"] }
criterion = { version = "0.8.2", features = ["async_tokio"] }

[[bench]]
name = "transfer_benchmarks"
harness = false
