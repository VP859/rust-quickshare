[workspace]
members = [
    ".",
    "src-tauri"
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.53.3", features = ["full", "test-util"] }
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
iroh = "1.3.0"
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }

[package]
name = "rqs_p2p"
version = "0.1.4"
edition = "2024"
description = "Ferry – secure P2P file sharing over QUIC"
repository = "https://github.com/VP859/rust-quickshare"

[lib]
name = "rqs_p2p"
path = "src/lib.rs"

[[bin]]
name = "rqs"
path = "src/main.rs"

[dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.23.1"
blake3 = { workspace = true }
indicatif = "0.18.6"
ratatui = "0.30.2"
crossterm = "0.29.0"
dirs = "7.0.0"
toml = "1.1.8"
tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
iroh = { workspace = true }
qrcode = { version = "0.14.1", default-features = false }
socket2 = { version = "0.6.5", features = ["all"] }
gethostname = "1.1.0"
rust-i18n = "4.2.4"

# ---------------------------------------------------------------------------
# Platform-specific dependencies (the Android NDK has no X11/Wayland
# or raw netlink sockets, so these crates are compiled conditionally)
# ---------------------------------------------------------------------------
[target.'cfg(not(target_os = "android"))'.dependencies]
# System clipboard (copying the TICKET in the TUI), desktop only
arboard = "3.7.0"
# Network interface enumeration via getifaddrs/netlink, desktop only
network-interface = "2.0.5"

[target.'cfg(target_os = "android")'.dependencies]
# getifaddrs: interface addresses and netmasks for local network discovery.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Tests of the Android getifaddrs code (glibc provides the same API).
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
criterion = { version = "0.8.2", features = ["async_tokio"] }
tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[[bench]]
name = "transfer_benchmarks"
harness = false
