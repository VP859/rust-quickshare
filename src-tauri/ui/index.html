<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Ferry</title>
<style>
  :root {
    --bg: #fafafa; --surface: #ffffff; --surface-2: #f4f4f5; --hover: #f4f4f5; --border: #e4e4e7; --border-strong: #d4d4d8;
    --text: #18181b; --muted: #71717a; --faint: #a1a1aa;
    --accent: #2563eb; --accent-hover: #1d4ed8; --accent-fg: #ffffff; --accent-soft: rgba(37, 99, 235, .09); --accent-text: #2563eb;
    --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --bad-soft: rgba(220, 38, 38, .08);
    --shadow-lg: 0 24px 64px rgba(0, 0, 0, .18);
    --radius: 12px; --radius-sm: 8px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b; --surface: #111113; --surface-2: #18181b; --hover: #1c1c20; --border: #27272a; --border-strong: #3f3f46;
      --text: #fafafa; --muted: #a1a1aa; --faint: #71717a;
      --accent: #3b82f6; --accent-hover: #2563eb; --accent-soft: rgba(59, 130, 246, .14); --accent-text: #60a5fa;
      --ok: #22c55e; --warn: #f59e0b; --bad: #f87171; --bad-soft: rgba(248, 113, 113, .1);
      --shadow-lg: 0 24px 64px rgba(0, 0, 0, .6);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
    padding-bottom: env(safe-area-inset-bottom);
  }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  svg.i.sm { width: 16px; height: 16px; }
  svg.i.lg { width: 22px; height: 22px; }
  .mono { font-family: var(--mono); font-size: .9em; word-break: break-all; -webkit-user-select: text; user-select: text; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .spacer { flex: 1; }

  button {
    font: inherit; font-weight: 500; cursor: pointer; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 12px; min-height: 34px;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap;
    transition: background .12s, border-color .12s, color .12s;
  }
  button:hover { background: var(--hover); border-color: var(--border-strong); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .row:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover { background: var(--hover); color: var(--text); }
  button.icon { padding: 0; width: 34px; }
  button.danger { color: var(--bad); }
  button.danger:hover { background: var(--bad-soft); border-color: var(--bad); }
  a { color: var(--accent-text); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }

  .topbar {
    position: sticky; top: 0; z-index: 30; padding-top: env(safe-area-inset-top);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner { max-width: 760px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; display: grid; place-items: center; flex: none; }
  .logo svg.i { width: 18px; height: 18px; stroke-width: 2.4; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--muted); background: var(--surface); max-width: 46vw; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .topbar .actions { display: flex; gap: 4px; }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--bad); }
  .dot.wait { background: var(--warn); }

  main { max-width: 760px; margin: 0 auto; padding: 24px 20px 32px; display: flex; flex-direction: column; gap: 28px; }

  .dropzone {
    border: 1.5px dashed var(--border-strong); border-radius: var(--radius); background: var(--surface);
    padding: 28px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px;
    transition: border-color .15s, background .15s;
  }
  .dropzone.drag-over { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone .badge-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; margin-bottom: 6px; }
  .dropzone h2 { font-size: 15px; font-weight: 600; }
  .dropzone p { color: var(--muted); max-width: 440px; font-size: 13px; }
  .dropzone .buttons { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }

  section > header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; min-height: 34px; }
  section > header h2 { font-size: 14px; font-weight: 600; }
  .count { font-size: 12px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; min-width: 22px; text-align: center; }
  .hint { color: var(--muted); font-size: 12.5px; margin: -4px 0 10px; }

  .list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .list.menu-open { overflow: visible; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; position: relative; transition: background .12s; }
  .row + .row { border-top: 1px solid var(--border); }
  .row.clickable { cursor: pointer; }
  .row.clickable:hover, .row.drag-over { background: var(--hover); }
  .row.drag-over { box-shadow: inset 3px 0 0 var(--accent); }
  .avatar { position: relative; width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
  .avatar .dot { position: absolute; right: -2px; bottom: -2px; border: 2px solid var(--surface); width: 12px; height: 12px; }
  .row .body { flex: 1; min-width: 0; }
  .row .title { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub .tag { color: var(--accent-text); }
  .row .trailing { display: flex; gap: 6px; align-items: center; flex: none; }
  .empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .empty svg.i { color: var(--faint); }
  .empty .warn { color: var(--warn); max-width: 520px; }

  .menu { position: absolute; top: calc(100% - 6px); right: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px; z-index: 20; min-width: 210px; box-shadow: var(--shadow-lg); }
  .menu button { width: 100%; justify-content: flex-start; border: none; background: transparent; padding: 6px 10px; font-weight: 450; }
  .menu button:hover { background: var(--hover); }
  .menu hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

  .transfer .dir { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); flex: none; align-self: flex-start; }
  .transfer.done .dir { color: var(--ok); }
  .transfer.failed .dir { color: var(--bad); }
  .transfer .meta { display: flex; justify-content: space-between; gap: 10px; }
  .transfer .progress { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .transfer .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; border-radius: 4px; }
  .transfer.done .progress > div { background: var(--ok); }
  .transfer.failed .progress > div { background: var(--bad); }
  .transfer .detail { color: var(--muted); font-size: 12.5px; word-break: break-all; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .transfer .trailing { align-self: flex-start; }

  footer { max-width: 760px; margin: 0 auto; padding: 0 20px 28px; color: var(--faint); font-size: 12px; display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(9, 9, 11, .5); display: flex; justify-content: center; align-items: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 100; }
  .modal-overlay.active { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 440px; max-height: 88vh; overflow: auto; box-shadow: var(--shadow-lg); transform: translateY(8px) scale(.98); transition: transform .15s; }
  .modal-overlay.active .modal { transform: none; }
  .modal-head { display: flex; align-items: center; gap: 8px; padding: 16px 14px 0 20px; min-height: 50px; }
  .modal-head h3 { flex: 1; font-size: 16px; font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-body { padding: 10px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding-top: 4px; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  input[type=text], textarea, select {
    background: var(--surface); border: 1px solid var(--border-strong); color: var(--text); padding: 7px 10px; border-radius: var(--radius-sm);
    font: inherit; -webkit-user-select: text; user-select: text; width: 100%; min-width: 0;
  }
  textarea { resize: vertical; min-height: 76px; font-family: var(--mono); font-size: 12.5px; }
  select {
    appearance: none; -webkit-appearance: none; padding-right: 32px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%; background-size: 5px 5px; background-repeat: no-repeat;
  }
  .inline { display: flex; gap: 8px; }

  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .toggle .label { font-weight: 500; }
  .toggle .desc { color: var(--muted); font-size: 12.5px; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--border-strong); border-radius: 999px; transition: background .15s; cursor: pointer; }
  .switch span::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::before { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  .group-title { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-bottom: -6px; }
  .group { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .codebox { background: var(--surface-2); border: 1px solid var(--border); padding: 8px 10px; border-radius: var(--radius-sm); max-height: 96px; overflow: auto; font-size: 12px; }

  .qr { background: #fff; border-radius: 12px; padding: 12px; align-self: center; width: min(240px, 100%); border: 1px solid var(--border); }
  .qr svg { width: 100%; height: auto; display: block; }
  .pair-code { font: 600 30px var(--mono); letter-spacing: .14em; text-align: center; padding: 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); -webkit-user-select: text; user-select: text; }
  .recipients { display: flex; flex-direction: column; gap: 6px; }
  .recipients .label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 8px 2px 0; }
  .recipients button.row { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); text-align: left; justify-content: flex-start; font-weight: 400; min-height: 0; }
  .recipients button.row:hover { border-color: var(--accent); background: var(--accent-soft); }
  .textbox { white-space: pre-wrap; word-break: break-word; max-height: 220px; font-size: 13px; }
  .about { display: flex; align-items: center; gap: 12px; }
  .about .logo { width: 36px; height: 36px; border-radius: 10px; }

  .toast {
    position: fixed; left: 50%; bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px)); transform: translate(-50%, calc(100% + 40px)); visibility: hidden;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; max-width: calc(100vw - 32px);
    transition: transform .25s cubic-bezier(.2, .9, .3, 1.15), visibility .25s; z-index: 200; font-size: 13.5px; box-shadow: var(--shadow-lg);
  }
  .toast.visible { transform: translate(-50%, 0); visibility: visible; }
  .toast.error { background: var(--bad); color: #fff; }

  .mobile-only { display: none !important; }
  body.mobile .mobile-only { display: inline-flex !important; }
  body.mobile h2.mobile-only, body.mobile p.mobile-only { display: block !important; }
  body.mobile .desktop-only { display: none !important; }
  @media (max-width: 560px) {
    .topbar-inner, main, footer { padding-left: 16px; padding-right: 16px; }
    .label-text { display: none; }
    .modal-overlay { align-items: flex-end; padding: 0; }
    .modal { max-width: none; border-radius: 16px 16px 0 0; border-bottom: none; padding-bottom: env(safe-area-inset-bottom); transform: translateY(24px); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="logo"><svg class="i"><use href="#i-logo"/></svg></span>Ferry</div>
    <span class="pill" id="node-pill"><span class="dot wait" id="node-dot"></span><span id="node-status"></span></span>
    <span class="spacer"></span>
    <div class="actions">
      <button class="ghost" id="btn-my-ticket"><svg class="i"><use href="#i-qr"/></svg><span class="label-text" data-i18n="my_ticket"></span></button>
      <button class="ghost icon" id="btn-settings" data-i18n-aria="settings" data-i18n-title="settings"><svg class="i"><use href="#i-sliders"/></svg></button>
    </div>
  </div>
</div>

<main>
  <section class="dropzone" id="dropzone">
    <div class="badge-icon"><svg class="i lg"><use href="#i-upload"/></svg></div>
    <h2 class="desktop-only" data-i18n="drop_here"></h2>
    <h2 class="mobile-only" data-i18n="send_files"></h2>
    <p class="desktop-only" data-i18n="drop_hint"></p>
    <p class="mobile-only" data-i18n="drop_hint_mobile"></p>
    <div class="buttons">
      <button class="primary" id="btn-select-file"><svg class="i sm"><use href="#i-file"/></svg><span data-i18n="select_file"></span></button>
      <button id="btn-send-text"><svg class="i sm"><use href="#i-text"/></svg><span data-i18n="send_text"></span></button>
      <button class="mobile-only" id="btn-scan"><svg class="i sm"><use href="#i-scan"/></svg><span data-i18n="scan_qr"></span></button>
      <button id="btn-receive-ticket"><svg class="i sm"><use href="#i-ticket"/></svg><span data-i18n="receive_ticket"></span></button>
    </div>
  </section>

  <section>
    <header>
      <h2 data-i18n="nearby"></h2><span class="count" id="nearby-count">0</span>
      <span class="spacer"></span>
      <button class="ghost" id="btn-nearby-refresh"><svg class="i sm"><use href="#i-refresh"/></svg><span data-i18n="search"></span></button>
    </header>
    <p class="hint" data-i18n="nearby_hint"></p>
    <div class="list" id="nearby"></div>
  </section>

  <section>
    <header>
      <h2 data-i18n="trusted"></h2><span class="count" id="peers-count">0</span>
      <span class="spacer"></span>
      <button id="btn-add-peer"><svg class="i sm"><use href="#i-plus"/></svg><span data-i18n="add_device"></span></button>
    </header>
    <div class="list" id="peers"></div>
  </section>

      text_empty: 'Najpierw wpisz lub wklej tekst', text_too_long: 'Tekst jest za długi (maks. 32 KB)', clipboard_empty: 'Schowek jest pusty',
      text_expired: 'Prośba o przesłanie tekstu wygasła', text_to: 'Tekst: {preview}',
    },
  };
  let lang = 'en';
  function t(key, vars = {}) {
    const v = I18N[lang]?.[key] ?? I18N.en[key] ?? key;
    return typeof v === 'function' ? v(vars) : v.replace(/\{(\w+)\}/g, (m, k) => k in vars ? String(vars[k]) : m);
  }
  function applyStaticText() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(e => { e.placeholder = t(e.dataset.i18nPh); });
    document.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', t(e.dataset.i18nAria)); });
    document.querySelectorAll('[data-i18n-title]').forEach(e => { e.title = t(e.dataset.i18nTitle); });
  }

  // ---------- Helpers ----------
  let toastTimer;
  function toast(msg, isError = false) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.toggle('error', isError);
    el.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('visible'), isError ? 6000 : 3000);
  }
  const fail = (e) => toast(String(e?.message ?? e), true);
  const fmtSize = (b) => b >= 1 << 30 ? (b / (1 << 30)).toFixed(2) + ' GB' : b >= 1 << 20 ? (b / (1 << 20)).toFixed(1) + ' MB' : b >= 1024 ? (b / 1024).toFixed(0) + ' KB' : b + ' B';
  const baseName = (p) => decodeURIComponent(String(p).split(/[\\/]/).pop() || p);
  const shortId = (id) => id.slice(0, 10) + '…';
  const initials = (name) => (String(name).trim().split(/\s+/).slice(0, 2).map(w => [...w][0]).join('') || '?').toUpperCase();
  function el(tag, props = {}, ...children) {
    const e = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => k === 'class' ? e.className = v : k.startsWith('on') ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v));
    children.flat().forEach(c => e.append(c instanceof Node ? c : document.createTextNode(String(c))));
    return e;
  }
  function icon(name, cls = '') {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', ('i ' + cls).trim());
    const use = document.createElementNS(ns, 'use');
    use.setAttribute('href', '#i-' + name);
    svg.append(use);
    return svg;
  }
  const preview = (text, max = 120) => { const flat = String(text).replace(/\s+/g, ' ').trim(); return flat.length > max ? flat.slice(0, max - 1) + '…' : flat; };
  const isLink = (text) => /^https?:\/\/\S+$/i.test(String(text).trim());
  const dotClass = (state) => 'dot ' + (state === true ? 'ok' : state === false ? 'bad' : 'wait');
  const open = (id) => $(id).classList.add('active');
  const close = (id) => $(id).classList.remove('active');
  document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', (e) => { if (e.target === m && m.getAttribute('role') !== 'alertdialog') close(m.id); }));
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => close(b.dataset.close)));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.active:not([role=alertdialog])').forEach(m => close(m.id)); });

  async function copyText(text) {
    try {
      if (T?.clipboardManager?.writeText) await T.clipboardManager.writeText(text);
      else await invoke('plugin:clipboard-manager|write_text', { text });
    } catch { await navigator.clipboard.writeText(text); }
    toast(t('copied'));
  }

  async function pickFiles() {
    const opts = { multiple: true, directory: false };
    const res = T?.dialog?.open ? await T.dialog.open(opts) : await invoke('plugin:dialog|open', { options: opts });
    if (!res) return [];
    return (Array.isArray(res) ? res : [res]).map(f => typeof f === 'string' ? f : f.path ?? f.uri ?? String(f));
  }

  async function scanQr() {
    const opts = { windowed: false, formats: ['QR_CODE'] };
    const res = T?.barcodeScanner?.scan ? await T.barcodeScanner.scan(opts) : await invoke('plugin:barcode-scanner|scan', opts);
    return res?.content?.trim();
  }

  function emptyState(iconName, text, extra = '') {
    return el('div', { class: 'empty' }, icon(iconName, 'lg'), el('div', {}, text), extra);
  }

  // ---------- Node ----------
  let nodeInfo = null;
  let nodeState = 'starting';
  function renderNodeStatus() {
    $('node-dot').className = 'dot ' + (nodeState === 'ok' ? 'ok' : nodeState === 'bad' ? 'bad' : 'wait');
    $('node-status').textContent = nodeState === 'ok' ? t('node_active', { id: shortId(nodeInfo.node_id) })
      : nodeState === 'bad' ? t('node_unavailable') : t('node_starting');
    $('node-pill').title = nodeInfo?.node_id ?? '';
  }
  async function loadNodeInfo() {
    try {
      nodeInfo = await invoke('get_node_info');
      nodeState = 'ok';
    } catch (e) {
      nodeState = 'bad';
      fail(e);
    }
    renderNodeStatus();
  }

  function showTicket(title, desc, ticket, svg) {
    $('ticket-title').textContent = title;
    $('ticket-desc').textContent = desc;
    $('ticket-qr').innerHTML = svg; // generated by the backend (qrcode crate), never user input
    $('ticket-text').textContent = ticket;
    open('modal-ticket');
  }
  $('btn-my-ticket').onclick = async () => {
    if (!nodeInfo) await loadNodeInfo();
    if (nodeInfo) showTicket(t('own_ticket_title'), t('own_ticket_desc'), nodeInfo.ticket, nodeInfo.qr_svg);
  };
  $('btn-ticket-copy').onclick = () => copyText($('ticket-text').textContent);
  $('btn-ticket-close').onclick = () => close('modal-ticket');

  // ---------- Trusted devices ----------
  let peers = [];
  const online = new Map();
  let openMenu = null;
  function closeMenu() {
    openMenu?.closest('.list')?.classList.remove('menu-open');
    openMenu?.remove();
    openMenu = null;
  }
  document.addEventListener('click', closeMenu);

  async function refreshPeers() {
    try { peers = await invoke('list_peers'); } catch (e) { fail(e); peers = []; }
    renderPeers();
  }

  function renderPeers() {
    const box = $('peers');
    $('peers-count').textContent = peers.length;
    closeMenu();
    box.replaceChildren();
    if (!peers.length) {
      box.append(emptyState('shield', t('no_peers')));
      return;
    }
    for (const p of peers) {
      const state = online.get(p.node_id);
      const status = state === true ? t('peer_online') : state === false ? t('peer_offline') : t('peer_checking');
      const label = t('send_to', { name: p.alias });
      const sendBtn = el('button', { class: 'ghost icon', 'aria-label': label, title: label,
        onclick: (e) => { e.stopPropagation(); sendToPeer(p); } }, icon('send', 'sm'));
      const menuBtn = el('button', { class: 'ghost icon', 'aria-label': t('device_options'), title: t('device_options'),
        onclick: (e) => { e.stopPropagation(); showMenu(row, p); } }, icon('more'));
      const row = el('div', { class: 'row clickable device', tabindex: '0', 'data-node': p.node_id, role: 'button', 'aria-label': label,
          onclick: () => sendToPeer(p),
          onkeydown: (e) => { if (e.key === 'Enter' && e.target === row) sendToPeer(p); } },
        el('div', { class: 'avatar' }, initials(p.alias), el('span', { class: dotClass(state) })),
        el('div', { class: 'body' },
          el('div', { class: 'title' }, p.alias),
          el('div', { class: 'sub', title: p.node_id }, status, p.auto_accept ? [' · ', el('span', { class: 'tag' }, 'Auto-Accept')] : '')),
        el('div', { class: 'trailing' }, sendBtn, menuBtn));
      box.append(row);
    }
  }

  async function checkOnline() {
    await Promise.all(peers.map(async (p) => {
      try { online.set(p.node_id, await invoke('peer_online', { nodeId: p.node_id })); }
      catch { online.set(p.node_id, false); }
      renderPeers();
    }));
  }

  function showMenu(row, p) {
    closeMenu();
    const item = (iconName, label, fn, cls = '') => el('button', { class: cls, onclick: async (e) => { e.stopPropagation(); closeMenu(); try { await fn(); } catch (err) { fail(err); } } }, icon(iconName, 'sm'), label);
    openMenu = el('div', { class: 'menu', role: 'menu', onclick: (e) => e.stopPropagation() },
      item('send', t('send_file_menu'), () => sendToPeer(p)),
      item('text', t('send_text_menu'), () => composeText(p.node_id, p.alias)),
      item('sliders', t('edit_peer'), () => openPeerModal(p)),
      item('shield', p.auto_accept ? t('auto_accept_off') : t('auto_accept_on'), async () => {
        await invoke('update_peer', { nodeId: p.node_id, alias: null, autoAccept: !p.auto_accept });
        await refreshPeers();
        toast(t(p.auto_accept ? 'auto_accept_disabled' : 'auto_accept_enabled', { name: p.alias }));
      }),
      item('code', t('copy_node_id'), () => copyText(p.node_id)),
      el('hr'),
      item('x', t('remove_device'), async () => {
        if (!confirm(t('confirm_remove', { name: p.alias }))) return;
        await invoke('remove_peer', { nodeId: p.node_id });
        online.delete(p.node_id);
        await refreshPeers();
        toast(t('device_removed'));
      }, 'danger'));
    row.closest('.list').classList.add('menu-open');
    row.append(openMenu);
  }

  let editing = null;
  function openPeerModal(peer = null, prefill = '') {
    editing = peer;
    $('peer-title').textContent = peer ? t('edit_title', { name: peer.alias }) : t('add_device');
    $('peer-input-field').style.display = peer ? 'none' : '';
    $('peer-pair-hint').style.display = peer ? 'none' : '';
    $('peer-input').value = prefill;
    $('peer-alias').value = peer?.alias ?? '';
    $('peer-auto').checked = peer?.auto_accept ?? false;
    open('modal-peer');
    (peer ? $('peer-alias') : $('peer-input')).focus();
  }
  $('btn-add-peer').onclick = () => openPeerModal();
  $('btn-peer-cancel').onclick = () => close('modal-peer');
  $('btn-peer-scan').onclick = async () => { try { const v = await scanQr(); if (v) $('peer-input').value = v; } catch (e) { fail(e); } };
  $('btn-peer-save').onclick = async () => {
    const alias = $('peer-alias').value.trim();
    const autoAccept = $('peer-auto').checked;
    try {
      if (editing) {
        await invoke('update_peer', { nodeId: editing.node_id, alias, autoAccept });
        toast(t('changes_saved'));
      } else {
        const input = $('peer-input').value.trim();
        if (!input) return toast(t('paste_ticket'), true);
        const id = await invoke('add_peer', { input, alias, autoAccept });
        online.delete(id);
        toast(t('device_added'));
      }
      close('modal-peer');
      await refreshPeers();
      checkOnline();
    } catch (e) { fail(e); }
  };

  // ---------- Nearby devices and pairing ----------
  let nearby = [];
  const PLATFORMS = { linux: 'Linux', windows: 'Windows', macos: 'macOS', android: 'Android', ios: 'iOS' };
  const platformLabel = (p) => PLATFORMS[p] ?? p;
  const platformIcon = (p) => p === 'android' || p === 'ios' ? 'phone' : 'monitor';
  const isTrusted = (id) => peers.some(p => p.node_id === id);

  function setNearby(list) {
    nearby = list || [];
    for (const d of nearby) if (isTrusted(d.node_id)) online.set(d.node_id, true);
    renderNearby();
    renderPeers();
  }

  function renderNearby() {
    const box = $('nearby');
    $('nearby-count').textContent = nearby.length;
    box.replaceChildren();
    if (!nearby.length) {
      const hint = el('div', { class: 'warn small' });
      box.append(emptyState('wifi', t('searching_nearby'), hint));
      invoke('discovery_health').then(h => { if (h) hint.textContent = h; }).catch(() => {});
      return;
    }
    for (const d of nearby) {
      const peer = peers.find(p => p.node_id === d.node_id);
      const send = el('button', { onclick: (e) => { e.stopPropagation(); sendToDevice(d.node_id, peer?.alias ?? d.name); } },
        icon('send', 'sm'), el('span', { class: 'label-text' }, t('send_file')));
      const text = el('button', { class: 'ghost icon', title: t('send_text'), 'aria-label': t('send_text'),
        onclick: (e) => { e.stopPropagation(); composeText(d.node_id, peer?.alias ?? d.name); } }, icon('text', 'sm'));
      const trailing = peer
        ? el('div', { class: 'trailing' }, text, send)
        : el('div', { class: 'trailing' }, text, send,
            el('button', { class: 'primary', onclick: (e) => { e.stopPropagation(); pairWith(d); } }, t('pair')));
      box.append(el('div', { class: 'row device', 'data-node': d.node_id },
        el('div', { class: 'avatar' }, icon(platformIcon(d.platform)), el('span', { class: 'dot ok' })),
        el('div', { class: 'body' },
          el('div', { class: 'title' }, d.name),
          el('div', { class: 'sub' }, platformLabel(d.platform), peer ? [' · ', el('span', { class: 'tag' }, t('paired_as', { name: peer.alias }))] : '')),
        trailing));
    }
  }

  async function sendToDevice(nodeId, label) {
    try { await sendFiles(await pickFiles(), nodeId, label); } catch (e) { fail(e); }
  }

  let pairingWith = null;
  async function pairWith(d) {
    try {
      pairingWith = d.node_id;
      $('pairing-title').textContent = t('pairing_with', { name: d.name });
      $('pairing-code').textContent = await invoke('pair_code', { nodeId: d.node_id });
      $('pairing-status').textContent = t('waiting_confirmation');
      open('modal-pairing');
      const alias = await invoke('pair_device', { nodeId: d.node_id });
      await refreshPeers();
      renderNearby();
      if (pairingWith === d.node_id) {
        $('pairing-status').textContent = t('paired_status', { name: alias });
        setTimeout(() => close('modal-pairing'), 1500);
      }
      toast(t('paired_with', { name: alias }));
    } catch (e) {
      if (pairingWith === d.node_id) $('pairing-status').textContent = t('not_paired', { error: String(e?.message ?? e) });
      else fail(e);
    }
  }
  $('btn-pairing-close').onclick = () => { pairingWith = null; close('modal-pairing'); };
  $('btn-nearby-refresh').onclick = async () => {
    try { await invoke('refresh_nearby'); toast(t('searching')); } catch (e) { fail(e); }
  };

  const pairRequests = [];
  function showNextPairRequest() {
    const r = pairRequests[0];
    if (!r) return close('modal-pair-request');
    $('pair-req-name').textContent = r.name;
    $('pair-req-code').textContent = r.code;
    $('pair-req-queue').textContent = pairRequests.length > 1 ? t('queued', { n: pairRequests.length - 1 }) : '';
    open('modal-pair-request');
  }
  async function answerPairRequest(accept) {
    const r = pairRequests.shift();
    if (r) {
      try {
        await invoke('respond_to_offer', { transferId: r.id, accept });
        if (accept) toast(t('paired_with', { name: r.name }));
      } catch (e) { fail(e); }
    }
    showNextPairRequest();
  }
  $('btn-pair-accept').onclick = () => answerPairRequest(true);
  $('btn-pair-reject').onclick = () => answerPairRequest(false);

  /** The Android host name is "localhost", so the phone model is used as the default device name. */
  async function detectDeviceModel() {
    try {
      const v = await navigator.userAgentData?.getHighEntropyValues?.(['model']);
      if (v?.model) return v.model;
    } catch {}
    const m = navigator.userAgent.match(/Android [^;]+; ([^;)]+)[;)]/);
    const model = m?.[1]?.trim();
    return model && model !== 'K' && model !== 'wv' ? model : null;
  }
  async function ensureDeviceName() {
    try {
      const dn = await invoke('get_device_name');
      if (dn.is_default && isMobile) {
        const model = await detectDeviceModel();
        if (model) await invoke('set_device_name', { name: model });
      }
    } catch (e) { console.warn('Device name:', e); }
  }

  // ---------- Sending ----------
  async function sendFiles(paths, target, label) {
    if (!paths.length) return;
    try {
      await invoke('send_files', { paths, target });
      const what = paths.length > 1 ? t('n_files', { n: paths.length }) : baseName(paths[0]);
      toast(t('sending', { what, name: label }));
    } catch (e) { fail(e); }
  }

  async function sendToPeer(p) {
    try { await sendFiles(await pickFiles(), p.node_id, p.alias); } catch (e) { fail(e); }
  }

  let pendingFiles = [];
  let pendingText = null;
  function recipientRow(avatar, title, sub, onclick) {
    return el('button', { class: 'row', onclick },
      el('div', { class: 'avatar' }, avatar),
      el('div', { class: 'body' }, el('div', { class: 'title' }, title), el('div', { class: 'sub' }, sub)));
  }
  function deliver(nodeId, label) {
    close('modal-recipient');
    if (pendingText !== null) sendText(pendingText, nodeId, label);
    else sendFiles(pendingFiles, nodeId, label);
  }
  function chooseRecipient(paths, text = null) {
    if (text === null && !paths.length) return;
    pendingFiles = paths;
    pendingText = text;
    $('recipient-files').textContent = text !== null ? t('text_to', { preview: preview(text) })
      : paths.length === 1 ? baseName(paths[0]) : t('n_files_list', { n: paths.length, list: paths.map(baseName).join(', ') });
    const box = $('recipients');
    box.replaceChildren();
    const unpaired = nearby.filter(d => !isTrusted(d.node_id));
    if (!peers.length && !unpaired.length) box.append(emptyState('inbox', t('no_devices')));
    for (const p of peers) {
      box.append(recipientRow([initials(p.alias), el('span', { class: dotClass(online.get(p.node_id)) })], p.alias, el('span', { class: 'mono' }, shortId(p.node_id)),
        () => deliver(p.node_id, p.alias)));
    }
    if (unpaired.length) box.append(el('div', { class: 'label' }, t('nearby_unpaired')));
    for (const d of unpaired) {
      box.append(recipientRow([icon(platformIcon(d.platform)), el('span', { class: 'dot ok' })], d.name, platformLabel(d.platform),
        () => deliver(d.node_id, d.name)));
    }
    $('btn-share-ticket').style.display = text !== null ? 'none' : '';
    $('btn-share-ticket').disabled = paths.length !== 1;
    $('btn-share-ticket').title = paths.length !== 1 ? t('ticket_one_file') : '';
    open('modal-recipient');
  }
  $('btn-share-ticket').onclick = async () => {
    close('modal-recipient');
    try {
      const s = await invoke('share_file', { path: pendingFiles[0] });
      showTicket(t('shared_title', { name: s.file_name }), t('shared_desc'), s.ticket, s.qr_svg);
    } catch (e) { fail(e); }
  };
  $('btn-select-file').onclick = async () => { try { chooseRecipient(await pickFiles()); } catch (e) { fail(e); } };

  // ---------- Text and links ----------
  const MAX_TEXT_BYTES = 32 * 1024;
  let textTarget = null;
  function composeText(nodeId = null, label = null, prefill = '') {
    textTarget = nodeId ? { nodeId, label } : null;
    $('text-input').value = prefill;
    $('btn-text-next').textContent = textTarget ? t('send_text') : t('choose_recipient_btn');
    open('modal-text-send');
    $('text-input').focus();
  }
  $('btn-send-text').onclick = () => composeText();
  $('btn-text-cancel').onclick = () => close('modal-text-send');
  $('btn-text-paste').onclick = async () => {
    try {
      const text = T?.clipboardManager?.readText ? await T.clipboardManager.readText() : await invoke('plugin:clipboard-manager|read_text');
      if (text) $('text-input').value = text; else toast(t('clipboard_empty'), true);
    } catch { toast(t('clipboard_empty'), true); }
  };
  $('btn-text-next').onclick = () => {
    const text = $('text-input').value;
    if (!text.trim()) return toast(t('text_empty'), true);
    if (new TextEncoder().encode(text).length > MAX_TEXT_BYTES) return toast(t('text_too_long'), true);
    close('modal-text-send');
    if (textTarget) sendText(text, textTarget.nodeId, textTarget.label);
    else chooseRecipient([], text);
  };

  let textSeq = 0;
  function addTextRow(entry) {
    const id = 'text-' + (++textSeq);
    const row = { el: el('div', { class: 'row transfer' }), text: entry };
    transfers.set(id, row);
    const list = $('transfers');
    list.querySelector('.empty')?.remove();
    list.prepend(row.el);
    renderTextRow(row);
    $('btn-clear').style.visibility = '';
    return row;
  }
  function renderTextRow(row) {
    const x = row.text;
    row.el.className = 'row transfer' + (x.state === 'done' ? ' done' : x.state === 'failed' ? ' failed' : '');
    const detail = x.state === 'sending' ? t('text_sending', { name: x.label })
      : x.state === 'failed' ? x.error
      : x.dir === 'upload' ? t('text_delivered', { name: x.label })
      : x.copied ? t('text_copied') : t('text_not_copied');
    const trailing = el('div', { class: 'trailing' },
      el('button', { class: 'ghost icon', title: t('copy'), 'aria-label': t('copy'), onclick: () => copyText(x.text) }, icon('copy', 'sm')));
    if (!isMobile && isLink(x.text)) {
      trailing.prepend(el('button', { onclick: () => invoke('open_link', { url: x.text.trim() }).catch(fail) }, t('open_link')));
    }
    row.el.replaceChildren(
      el('div', { class: 'dir' }, icon('text', 'sm')),
      el('div', { class: 'body' },
        el('div', { class: 'meta' }, el('span', { class: 'title' }, preview(x.text, 80)),
          el('span', { class: 'muted small' }, (x.dir === 'upload' ? '↑ ' : '↓ ') + x.label)),
        el('div', { class: 'detail' }, detail)),
      trailing);
  }
  async function sendText(text, nodeId, label) {
    const row = addTextRow({ dir: 'upload', text, label, state: 'sending' });
    try {
      await invoke('send_text', { text, target: nodeId });
      row.text.state = 'done';
    } catch (e) {
      row.text.state = 'failed';
      row.text.error = String(e?.message ?? e);
      fail(e);
    }
    renderTextRow(row);
  }

  const textRequests = [];
  function showNextTextRequest() {
    const r = textRequests[0];
    if (!r) return close('modal-text-in');
    $('text-in-from').textContent = t('text_from', { name: r.alias ?? t('unknown_device', { id: shortId(r.peer) }) });
    $('text-in-body').textContent = r.text;
    $('text-in-queue').textContent = textRequests.length > 1 ? t('queued', { n: textRequests.length - 1 }) : '';
    open('modal-text-in');
  }
  async function answerTextRequest(accept) {
    const r = textRequests.shift();
    if (r) { try { await invoke('respond_to_offer', { transferId: r.id, accept }); } catch (e) { fail(e); } }
    showNextTextRequest();
  }
  $('btn-text-accept').onclick = () => answerTextRequest(true);
  $('btn-text-reject').onclick = () => answerTextRequest(false);
  function onTextReceived(x) {
    const label = x.alias ?? shortId(x.peer);
    addTextRow({ dir: 'download', text: x.text, label, state: 'done', copied: x.copied });
    toast(x.copied ? t('text_received_toast', { name: label }) : t('text_not_copied'), !x.copied);
  }

  // ---------- Receiving from a TICKET / QR code ----------
  async function handleScannedTicket(text) {
    if (!text) return;
    const info = await invoke('inspect_ticket', { ticket: text });
    if (info.has_share) {
      await invoke('receive_from_ticket', { ticket: text });
      toast(t('downloading'));
    } else {
      openPeerModal(null, text);
    }
  }
  $('btn-scan').onclick = async () => { try { await handleScannedTicket(await scanQr()); } catch (e) { fail(e); } };
  $('btn-receive-ticket').onclick = () => { $('receive-input').value = ''; open('modal-receive'); $('receive-input').focus(); };
  $('btn-receive-cancel').onclick = () => close('modal-receive');
  $('btn-receive-go').onclick = async () => {
    try { await handleScannedTicket($('receive-input').value.trim()); close('modal-receive'); } catch (e) { fail(e); }
  };

  // ---------- Native drag and drop (Tauri) ----------
  function targetAt(pos) {
    if (!pos) return null;
    const ratio = window.devicePixelRatio || 1;
    const node = document.elementFromPoint(pos.x / ratio, pos.y / ratio);
    return node?.closest('.device') || node?.closest('#dropzone') || null;
  }
  let hovered = null;
  function setHover(target) {
    if (hovered === target) return;
    hovered?.classList.remove('drag-over');
    hovered = target;
    hovered?.classList.add('drag-over');
  }
  async function setupDragDrop() {
    const webview = T?.webview?.getCurrentWebview?.();
    if (!webview?.onDragDropEvent) return;
    await webview.onDragDropEvent(({ payload }) => {
      if (payload.type === 'enter' || payload.type === 'over') {
        setHover(targetAt(payload.position) || $('dropzone'));
      } else if (payload.type === 'drop') {
        const target = targetAt(payload.position);
        setHover(null);
        const paths = payload.paths || [];
        const id = target?.dataset?.node;
        const peer = id && peers.find(p => p.node_id === id);
        const device = id && nearby.find(d => d.node_id === id);
        if (peer) sendFiles(paths, peer.node_id, peer.alias);
        else if (device) sendFiles(paths, device.node_id, device.name);
        else chooseRecipient(paths);
      } else {
        setHover(null);
      }
    });
  }

  // ---------- Transfers ----------
  const transfers = new Map();
  function renderTransfer(ev) {
    let row = transfers.get(ev.id);
    if (!row) {
      row = { el: el('div', { class: 'row transfer' }) };
      transfers.set(ev.id, row);
      const list = $('transfers');
      list.querySelector('.empty')?.remove();
      list.prepend(row.el);
    }
    row.ev = ev;
    const kind = ev.status.kind;
    const pct = ev.total ? Math.min(100, Math.round(ev.done / ev.total * 100)) : (kind === 'completed' ? 100 : 0);
    const peer = peers.find(p => p.node_id === ev.peer)?.alias ?? shortId(ev.peer);
    const detail = kind === 'running' ? `${pct}% · ${fmtSize(ev.done)} / ${fmtSize(ev.total)}`
      : kind === 'failed' ? t('tr_failed', { error: ev.status.error }) : kind === 'rejected' ? t('tr_rejected', { reason: ev.status.reason })
      : kind === 'completed' && ev.status.path ? t('tr_saved', { path: ev.status.path }) : t('st_' + kind);
    row.el.className = 'row transfer' + (kind === 'completed' ? ' done' : kind === 'failed' || kind === 'rejected' ? ' failed' : '');
    const bar = el('div', { class: 'progress' }, el('div'));
    bar.firstChild.style.width = pct + '%';
    const parts = [
      el('div', { class: 'dir' }, icon(ev.direction === 'upload' ? 'up' : 'down', 'sm')),
      el('div', { class: 'body' },
        el('div', { class: 'meta' }, el('span', { class: 'title' }, ev.file_name), el('span', { class: 'muted small' }, peer)),
        bar,
        el('div', { class: 'detail' }, detail))];
    if (kind === 'completed' && ev.direction === 'download' && ev.status.path && !isMobile) {
      const openFile = (reveal) => invoke('open_received', { path: ev.status.path, reveal }).catch(fail);
      parts.push(el('div', { class: 'trailing' },
        el('button', { onclick: () => openFile(false) }, t('open')),
        el('button', { class: 'ghost icon', title: t('show_in_folder'), 'aria-label': t('show_in_folder'), onclick: () => openFile(true) }, icon('folder', 'sm'))));
    }
    row.el.replaceChildren(...parts);
    $('btn-clear').style.visibility = '';
  }
  function renderNoTransfers() {
    if (!transfers.size) $('transfers').replaceChildren(emptyState('inbox', t('no_transfers')));
    $('btn-clear').style.visibility = transfers.size ? '' : 'hidden';
  }
  $('btn-clear').onclick = () => {
    for (const [id, row] of transfers) {
      const finished = row.text ? row.text.state !== 'sending' : ['completed', 'failed', 'rejected'].includes(row.ev.status.kind);
      if (finished) { row.el.remove(); transfers.delete(id); }
    }
    renderNoTransfers();
  };

  // ---------- Incoming offers ----------
  const offers = [];
  function showNextOffer() {
    const o = offers[0];
    if (!o) return close('modal-offer');
    $('offer-file').textContent = o.file_name;
    $('offer-meta').textContent = t('from', { size: fmtSize(o.size), name: o.alias ?? t('unknown_device', { id: shortId(o.peer) }) });
    $('offer-queue').textContent = offers.length > 1 ? t('queued', { n: offers.length - 1 }) : '';
    open('modal-offer');
  }
  async function answerOffer(accept) {
    const o = offers.shift();
    if (o) { try { await invoke('respond_to_offer', { transferId: o.id, accept }); } catch (e) { fail(e); } }
    showNextOffer();
  }
  $('btn-offer-accept').onclick = () => answerOffer(true);
  $('btn-offer-reject').onclick = () => answerOffer(false);

  // ---------- Language ----------
  function rerender() {
    applyStaticText();
    renderNodeStatus();
    renderPeers();
    renderNearby();
    for (const row of transfers.values()) row.text ? renderTextRow(row) : renderTransfer(row.ev);
    renderNoTransfers();
    if (offers.length) showNextOffer();
    if (pairRequests.length) showNextPairRequest();
    if (textRequests.length) showNextTextRequest();
  }
  async function loadLanguage() {
    try {
      const info = await invoke('get_language');
      lang = info.code;
      $('language').replaceChildren(...info.available.map(l => el('option', { value: l.code }, l.name)));
      $('language').value = lang;
    } catch (e) { console.warn('Language:', e); }
  }
  $('language').onchange = async (e) => {
    try {
      lang = await invoke('set_language', { code: e.target.value });
      rerender();
    } catch (err) { e.target.value = lang; fail(err); }
  };

  // ---------- Settings and about ----------
  async function loadAppInfo() {
    try {
      const info = await invoke('app_info');
      $('footer-version').textContent = `${info.name} ${info.version}`;
      $('about-version').textContent = `${info.name} ${info.version}`;
    } catch {}
  }
  const openRepository = () => invoke('open_repository').catch(fail);
  $('link-repo').onclick = openRepository;
  $('btn-repo').onclick = openRepository;
  $('btn-settings').onclick = async () => {
    if (!nodeInfo) await loadNodeInfo();
    $('settings-node').textContent = nodeInfo?.node_id ?? '—';
    try { $('device-name').value = (await invoke('get_device_name')).name; } catch {}
    $('settings-dir').textContent = nodeInfo?.download_dir ?? '—';
    $('language').value = lang;
    if (!isMobile) { try { $('autostart').checked = await invoke('plugin:autostart|is_enabled'); } catch {} }
    open('modal-settings');
  };
  $('btn-device-name-save').onclick = async () => {
    try { $('device-name').value = await invoke('set_device_name', { name: $('device-name').value }); toast(t('name_saved')); }
    catch (e) { fail(e); }
  };
  $('autostart').onchange = async (e) => {
    try { await invoke(e.target.checked ? 'plugin:autostart|enable' : 'plugin:autostart|disable'); toast(t('saved')); }
    catch (err) { e.target.checked = !e.target.checked; fail(err); }
  };
  $('btn-change-dir').onclick = async () => {
    try {
      const dir = T?.dialog?.open ? await T.dialog.open({ directory: true }) : await invoke('plugin:dialog|open', { options: { directory: true } });
      if (!dir) return;
      await invoke('set_download_dir', { path: String(dir) });
      await loadNodeInfo();
      $('settings-dir').textContent = nodeInfo?.download_dir ?? String(dir);
      toast(t('dir_changed'));
    } catch (e) { fail(e); }
  };

  // ---------- Android integration ----------
  async function checkSharedFiles() {
    try {
      const files = await invoke('take_shared_files');
      if (files.length) return chooseRecipient(files);
      const text = await invoke('take_shared_text');
      if (text) composeText(null, null, text);
    } catch (e) { fail(e); }
  }
  window.addEventListener('rqs-share', checkSharedFiles);
  window.addEventListener('rqs-lan-permission', async () => {
    try { await invoke('refresh_nearby'); toast(t('lan_granted')); }
    catch (e) { fail(e); }
  });

  // ---------- Startup ----------
  document.addEventListener('DOMContentLoaded', async () => {
    applyStaticText();
    renderNodeStatus();
    renderNoTransfers();
    renderPeers();
    if (!invoke) { toast(t('no_tauri'), true); return; }
    await loadLanguage();
    applyStaticText();
    renderNodeStatus();
    renderNoTransfers();
    loadAppInfo();
    await listen('transfer', ({ payload }) => renderTransfer(payload));
    await listen('transfer-error', ({ payload }) => fail(payload.message));
    await listen('incoming-offer', ({ payload }) => { offers.push(payload); if (offers.length === 1) showNextOffer(); else $('offer-queue').textContent = t('queued', { n: offers.length - 1 }); });
    await listen('node-error', ({ payload }) => fail(payload));
    await listen('incoming-text', ({ payload }) => { textRequests.push(payload); if (textRequests.length === 1) showNextTextRequest(); else $('text-in-queue').textContent = t('queued', { n: textRequests.length - 1 }); });
    await listen('text-received', ({ payload }) => onTextReceived(payload));
    await listen('request-cancelled', ({ payload }) => {
      const i = textRequests.findIndex(r => r.id === payload);
      if (i < 0) return;
      textRequests.splice(i, 1);
      if (i === 0) showNextTextRequest();
      toast(t('text_expired'), true);
    });
    await listen('nearby', ({ payload }) => setNearby(payload));
    await listen('peers-changed', async () => { await refreshPeers(); renderNearby(); });
    await listen('pair-result', async ({ payload }) => {
      toast(payload.message, !payload.ok);
      await refreshPeers();
      renderNearby();
    });
    await listen('pair-request', ({ payload }) => { pairRequests.push(payload); if (pairRequests.length === 1) showNextPairRequest(); else $('pair-req-queue').textContent = t('queued', { n: pairRequests.length - 1 }); });
    await listen('pair-cancelled', ({ payload }) => {
      const i = pairRequests.findIndex(r => r.id === payload);
      if (i < 0) return;
      pairRequests.splice(i, 1);
      if (i === 0) showNextPairRequest();
      toast(t('pair_expired'), true);
    });
    await setupDragDrop();
    await refreshPeers();
    await ensureDeviceName();
    try { setNearby(await invoke('list_nearby')); } catch {}
    await loadNodeInfo();
    checkOnline();
    setInterval(checkOnline, 60000);
    setInterval(() => { if (!nearby.length) renderNearby(); }, 5000);
    if (isMobile) checkSharedFiles();
  });
})();
</script>
</body>
</html>
