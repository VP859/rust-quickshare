<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Ferry</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4 8h15M15 4l4 4-4 4M20 16H5M9 12l-4 4 4 4"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 20h1v1h-1zM20 14h1M14 20h1"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8M21 3v5h-5"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><path d="M12 5h.01M12 12h.01M12 19h.01" stroke-width="3"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
  <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M2 9a3 3 0 0 0 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 0 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2zM13 5v2M13 17v2M13 11v2"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><path d="M3 4h18a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM8 21h8M12 17v4"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM12 18h.01"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><path d="M11 9h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2zM5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></symbol>
</svg>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="logo"><svg class="i"><use href="#i-logo"/></svg></span>Ferry</div>
    <span class="pill" id="node-pill"><span class="dot wait" id="node-dot"></span><span id="node-status"></span></span>
    <button class="pill mode-pill" id="mode-pill" hidden></button>
    <span class="spacer"></span>
    <div class="actions">
      <button class="ghost" id="btn-my-ticket"><svg class="i"><use href="#i-qr"/></svg><span class="label-text" data-i18n="my_ticket"></span></button>
      <button class="ghost icon" id="btn-settings" data-i18n-aria="settings" data-i18n-title="settings"><svg class="i"><use href="#i-sliders"/></svg></button>
    </div>
  </div>
</div>

<main>
  <section class="dropzone" id="dropzone">
    <div class="badge-icon"><svg class="i lg"><use href="#i-upload"/></svg></div>
    <h2 class="desktop-only" data-i18n="drop_here"></h2>
    <h2 class="mobile-only" data-i18n="send_files"></h2>
    <p class="desktop-only" data-i18n="drop_hint"></p>
    <p class="mobile-only" data-i18n="drop_hint_mobile"></p>
    <div class="buttons">
      <button class="primary" id="btn-select-file"><svg class="i sm"><use href="#i-file"/></svg><span data-i18n="select_file"></span></button>
      <button class="desktop-only" id="btn-select-folder"><svg class="i sm"><use href="#i-folder"/></svg><span data-i18n="select_folder"></span></button>
      <button id="btn-send-text"><svg class="i sm"><use href="#i-text"/></svg><span data-i18n="send_text"></span></button>
      <button class="mobile-only" id="btn-scan"><svg class="i sm"><use href="#i-scan"/></svg><span data-i18n="scan_qr"></span></button>
      <button id="btn-receive-ticket"><svg class="i sm"><use href="#i-ticket"/></svg><span data-i18n="receive_ticket"></span></button>
      <button id="btn-web-receive"><svg class="i sm"><use href="#i-globe"/></svg><span data-i18n="receive_browser"></span></button>
    </div>
  </section>

  <section>
    <header>
      <h2 data-i18n="nearby"></h2><span class="count" id="nearby-count">0</span>
      <span class="spacer"></span>
      <button class="ghost" id="btn-nearby-refresh"><svg class="i sm"><use href="#i-refresh"/></svg><span data-i18n="search"></span></button>
    </header>
    <p class="hint" data-i18n="nearby_hint"></p>
    <div class="list" id="nearby"></div>
    <p class="hint warn" id="nearby-hint" hidden></p>
  </section>

  <section>
    <header>
      <h2 data-i18n="trusted"></h2><span class="count" id="peers-count">0</span>
      <span class="spacer"></span>
      <button id="btn-add-peer"><svg class="i sm"><use href="#i-plus"/></svg><span data-i18n="add_device"></span></button>
    </header>
    <div class="list" id="peers"></div>
  </section>

  <section>
    <header>
      <h2 data-i18n="transfers"></h2>
      <span class="spacer"></span>
      <button class="ghost" id="btn-history" data-i18n="history"></button>
      <button class="ghost" id="btn-clear" data-i18n="clear_finished"></button>
    </header>
    <div class="list" id="transfers"></div>
  </section>
</main>

<footer>
  <span id="footer-version">Ferry</span><span>·</span><span data-i18n="oss_note"></span>
  <span class="desktop-only">·</span><a class="desktop-only" id="link-repo" data-i18n="source_code"></a>
</footer>

<div class="modal-overlay" id="modal-peer" role="dialog" aria-modal="true" aria-labelledby="peer-title">
  <div class="modal">
    <div class="modal-head"><h3 id="peer-title"></h3><button class="ghost icon" data-close="modal-peer" data-i18n-aria="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="modal-body">
      <div class="field" id="peer-input-field">
        <label for="peer-input" data-i18n="ticket_or_id"></label>
        <textarea id="peer-input" data-i18n-ph="ticket_or_id_ph"></textarea>
        <button class="mobile-only" id="btn-peer-scan" style="align-self:flex-start"><svg class="i sm"><use href="#i-scan"/></svg><span data-i18n="scan_qr"></span></button>
      </div>
      <div class="field">
        <label for="peer-alias" data-i18n="alias"></label>
        <input type="text" id="peer-alias" data-i18n-ph="alias_ph" maxlength="60">
      </div>
      <div class="toggle">
        <div><div class="label">Auto-Accept</div><div class="desc" data-i18n="auto_accept_hint"></div></div>
        <label class="switch"><input type="checkbox" id="peer-auto"><span></span></label>
      </div>
      <p class="muted small" id="peer-pair-hint" data-i18n="pair_after_add_hint"></p>
      <div class="modal-actions">
        <button id="btn-peer-cancel" data-i18n="cancel"></button>
        <button class="primary" id="btn-peer-save" data-i18n="save"></button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-recipient" role="dialog" aria-modal="true" aria-labelledby="recipient-title">
  <div class="modal">
    <div class="modal-head"><h3 id="recipient-title" data-i18n="choose_recipient"></h3><button class="ghost icon" data-close="modal-recipient" data-i18n-aria="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="modal-body">
      <p class="muted small" id="recipient-files"></p>
      <div class="recipients" id="recipients"></div>
      <button class="primary" id="btn-send-selected" hidden></button>
      <button id="btn-share-ticket"><svg class="i sm"><use href="#i-link"/></svg><span data-i18n="share_by_ticket"></span></button>
      <button id="btn-share-web"><svg class="i sm"><use href="#i-globe"/></svg><span data-i18n="share_in_browser"></span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-ticket" role="dialog" aria-modal="true" aria-labelledby="ticket-title">
  <div class="modal">
    <div class="modal-head"><h3 id="ticket-title">TICKET</h3><button class="ghost icon" data-close="modal-ticket" data-i18n-aria="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="modal-body">
      <p class="muted small" id="ticket-desc"></p>
      <div class="qr" id="ticket-qr"></div>
      <div class="codebox mono" id="ticket-text"></div>
      <div class="modal-actions">
        <button id="btn-ticket-close" data-i18n="close"></button>
        <button class="primary" id="btn-ticket-copy" data-i18n="copy"></button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-history" role="dialog" aria-modal="true" aria-labelledby="history-title">
  <div class="modal">
    <div class="modal-head"><h3 id="history-title" data-i18n="history"></h3><button class="ghost icon" data-close="modal-history" data-i18n-aria="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="modal-body">
      <div class="tabs" role="tablist" id="history-tabs">
        <button role="tab" data-kind="all" aria-selected="true" data-i18n="hist_all"></button>
        <button role="tab" data-kind="file" aria-selected="false" data-i18n="hist_files"></button>
        <button role="tab" data-kind="text" aria-selected="false" data-i18n="hist_texts"></button>
      </div>
      <input type="search" id="history-search" data-i18n-ph="history_search" data-i18n-aria="history_search" autocomplete="off">
      <div class="list history-list" id="history-list"></div>
      <p class="muted small" id="history-off" data-i18n="history_off" hidden></p>
      <div class="modal-actions">
        <button class="danger" id="btn-history-clear" data-i18n="history_clear"></button>
        <button class="primary" data-close="modal-history" data-i18n="close"></button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-web" role="dialog" aria-modal="true" aria-labelledby="web-title">
  <div class="modal">
    <div class="modal-head"><h3 id="web-title"></h3><button class="ghost icon" data-close="modal-web" data-i18n-aria="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="modal-body">
      <p class="muted small" data-i18n="web_desc"></p>
      <div class="qr" id="web-qr"></div>
      <div class="codebox mono" id="web-url"></div>
      <div class="muted small" id="web-other" hidden></div>
      <p class="muted small" id="web-expires"></p>
      <p class="hint warn small" id="web-firewall" hidden></p>
      <p class="compat-warning" data-i18n="web_security"></p>
      <div class="modal-actions">
        <button class="danger" id="btn-web-stop" data-i18n="web_stop"></button>
        <button class="primary" id="btn-web-copy" data-i18n="copy"></button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-receive" role="dialog" aria-modal="true" aria-labelledby="receive-title">
  <div class="modal">
    <div class="modal-head"><h3 id="receive-title" data-i18n="receive_title"></h3><button class="ghost icon" data-close="modal-receive" data-i18n-aria="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="modal-body">
      <div class="field"><label for="receive-input" data-i18n="share_ticket"></label><textarea id="receive-input" placeholder="ferry:…"></textarea></div>
      <div class="modal-actions"><button id="btn-receive-cancel" data-i18n="cancel"></button><button class="primary" id="btn-receive-go" data-i18n="download"></button></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-safety" role="dialog" aria-modal="true" aria-labelledby="safety-title">
  <div class="modal">
    <div class="modal-head"><h3 id="safety-title"></h3><button class="ghost icon" data-close="modal-safety" data-i18n-aria="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="modal-body">
      <p class="muted small" data-i18n="safety_how"></p>
      <div class="safety-number" id="safety-number" aria-live="polite"></div>
      <div class="toggle">
        <div><div class="label" id="safety-verified-label" data-i18n="safety_verified"></div><div class="desc" data-i18n="safety_verified_hint"></div></div>
        <label class="switch"><input type="checkbox" id="safety-verified" aria-labelledby="safety-verified-label"><span></span></label>
      </div>
      <div class="modal-actions"><button id="btn-safety-copy" data-i18n="copy"></button><button class="primary" data-close="modal-safety" data-i18n="close"></button></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-offer" role="alertdialog" aria-modal="true" aria-labelledby="offer-title">
  <div class="modal">
    <div class="modal-head"><h3 id="offer-title" data-i18n="incoming_file"></h3></div>
    <div class="modal-body">
      <div class="row" style="padding:0">
        <div class="avatar"><svg class="i"><use href="#i-file"/></svg></div>
        <div class="body"><div class="title" id="offer-file"></div><div class="sub" id="offer-meta"></div></div>
      </div>
      <p class="compat-warning" id="offer-localsend" hidden></p>
      <p class="compat-warning" id="offer-browser" hidden></p>
      <div class="codebox textbox small" id="offer-names" hidden></div>
      <p class="risk-warning" id="offer-risk" role="alert" hidden></p>
      <p class="muted small" id="offer-queue"></p>
      <div class="modal-actions"><button class="danger" id="btn-offer-reject" data-i18n="reject"></button><button class="primary" id="btn-offer-accept" data-i18n="accept"></button></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-text-send" role="dialog" aria-modal="true" aria-labelledby="text-send-title">
  <div class="modal">
    <div class="modal-head"><h3 id="text-send-title" data-i18n="text_send_title"></h3><button class="ghost icon" data-close="modal-text-send" data-i18n-aria="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="modal-body">
      <div class="field">
        <label for="text-input" data-i18n="text_label"></label>
        <textarea id="text-input" rows="5" data-i18n-ph="text_ph" style="font-family: inherit; font-size: 14px"></textarea>
      </div>
      <p class="muted small" data-i18n="text_send_hint"></p>
      <div class="modal-actions">
        <button id="btn-text-paste" style="margin-right:auto"><svg class="i sm"><use href="#i-copy"/></svg><span data-i18n="paste"></span></button>
        <button id="btn-text-cancel" data-i18n="cancel"></button>
        <button class="primary" id="btn-text-next" data-i18n="choose_recipient_btn"></button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-text-in" role="alertdialog" aria-modal="true" aria-labelledby="text-in-title">
  <div class="modal">
    <div class="modal-head"><h3 id="text-in-title" data-i18n="incoming_text"></h3></div>
    <div class="modal-body">
      <p class="muted small" id="text-in-from"></p>
      <div class="codebox textbox" id="text-in-body" style="-webkit-user-select:text; user-select:text"></div>
      <p class="muted small" id="text-in-queue"></p>
      <div class="modal-actions"><button class="danger" id="btn-text-reject" data-i18n="reject"></button><button class="primary" id="btn-text-accept" data-i18n="accept_copy"></button></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-pairing" role="dialog" aria-modal="true" aria-labelledby="pairing-title">
  <div class="modal">
    <div class="modal-head"><h3 id="pairing-title"></h3></div>
    <div class="modal-body">
      <p class="muted small" data-i18n="pairing_confirm_hint"></p>
      <div class="pair-code" id="pairing-code"></div>
      <p class="muted small" id="pairing-status" role="status"></p>
      <div class="modal-actions"><button id="btn-pairing-close" data-i18n="close"></button></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-pair-request" role="alertdialog" aria-modal="true" aria-labelledby="pair-req-title">
  <div class="modal">
    <div class="modal-head"><h3 id="pair-req-title" data-i18n="pair_request"></h3></div>
    <div class="modal-body">
      <p><strong id="pair-req-name"></strong> <span data-i18n="pair_request_text"></span></p>
      <p class="muted small" data-i18n="pair_request_hint"></p>
      <div class="pair-code" id="pair-req-code"></div>
      <p class="muted small" id="pair-req-queue"></p>
      <div class="modal-actions"><button class="danger" id="btn-pair-reject" data-i18n="reject"></button><button class="primary" id="btn-pair-accept" data-i18n="pair"></button></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="modal">
    <div class="modal-head"><h3 id="settings-title" data-i18n="settings"></h3><button class="ghost icon" data-close="modal-settings" data-i18n-aria="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="modal-body">
      <div class="group-title" data-i18n="section_device"></div>
      <div class="group">
        <div class="field"><label for="device-name" data-i18n="device_name"></label>
          <div class="inline"><input type="text" id="device-name" maxlength="64"><button id="btn-device-name-save" data-i18n="save"></button></div></div>
        <div class="field"><label data-i18n="node_id_label"></label><div class="codebox mono" id="settings-node"></div></div>
      </div>
      <div class="group-title" data-i18n="section_receiving"></div>
      <div class="group">
        <div class="field"><label data-i18n="download_dir"></label><div class="codebox mono" id="settings-dir"></div>
          <button class="desktop-only" id="btn-change-dir" style="align-self:flex-start"><svg class="i sm"><use href="#i-folder"/></svg><span data-i18n="change_dir"></span></button></div>
        <div class="field desktop-only"><label for="close-action" data-i18n="close_action"></label>
          <select id="close-action">
            <option value="tray" data-i18n="close_tray"></option>
            <option value="quit" data-i18n="close_quit"></option>
          </select>
          <div class="muted small" data-i18n="close_action_hint"></div>
        </div>
        <div class="field"><label for="speed-limit" data-i18n="speed_limit"></label>
          <div class="inline"><input type="text" id="speed-limit" data-i18n-ph="speed_limit_ph" autocomplete="off"><button id="btn-speed-save" data-i18n="save"></button></div>
          <div class="muted small" data-i18n="speed_limit_hint"></div>
        </div>
        <div class="toggle desktop-only">
          <div><div class="label" data-i18n="autostart"></div><div class="desc" data-i18n="autostart_hint"></div></div>
          <label class="switch"><input type="checkbox" id="autostart"><span></span></label>
        </div>
      </div>
      <div id="background-section" hidden>
        <div class="group-title" data-i18n="section_background"></div>
        <div class="group">
          <ul class="background-status small" id="background-status"></ul>
          <div class="muted small" data-i18n="background_hint"></div>
          <button id="btn-app-settings" style="align-self:flex-start" data-i18n="open_app_settings"></button>
        </div>
      </div>
      <div class="group-title" data-i18n="section_privacy"></div>
      <div class="group">
        <div class="toggle">
          <div><div class="label" id="privacy-hidden-label" data-i18n="privacy_hidden"></div><div class="desc" data-i18n="privacy_hidden_hint"></div></div>
          <label class="switch"><input type="checkbox" id="privacy-hidden" aria-labelledby="privacy-hidden-label"><span></span></label>
        </div>
        <div class="toggle">
          <div><div class="label" id="privacy-paired-label" data-i18n="privacy_paired_only"></div><div class="desc" data-i18n="privacy_paired_only_hint"></div></div>
          <label class="switch"><input type="checkbox" id="privacy-paired" aria-labelledby="privacy-paired-label"><span></span></label>
        </div>
        <div class="toggle" id="pairing-window" hidden>
          <div><div class="label" id="pairing-window-label"></div><div class="desc" data-i18n="pairing_window_hint"></div></div>
          <button class="ghost" id="btn-pairing-window"></button>
        </div>
        <div class="toggle">
          <div><div class="label" id="privacy-texts-label" data-i18n="privacy_texts"></div><div class="desc" data-i18n="privacy_texts_hint"></div></div>
          <label class="switch"><input type="checkbox" id="privacy-texts" aria-labelledby="privacy-texts-label"><span></span></label>
        </div>
        <div class="toggle">
          <div><div class="label" id="privacy-exe-label" data-i18n="privacy_executables"></div><div class="desc" data-i18n="privacy_executables_hint"></div></div>
          <label class="switch"><input type="checkbox" id="privacy-exe" aria-labelledby="privacy-exe-label"><span></span></label>
        </div>
        <div class="toggle">
          <div><div class="label" id="privacy-localsend-label" data-i18n="privacy_localsend"></div><div class="desc" data-i18n="privacy_localsend_hint"></div></div>
          <label class="switch"><input type="checkbox" id="privacy-localsend" aria-labelledby="privacy-localsend-label"><span></span></label>
        </div>
        <div class="toggle" id="keyring-toggle" hidden>
          <div><div class="label" id="privacy-keyring-label" data-i18n="privacy_keyring"></div><div class="desc" data-i18n="privacy_keyring_hint"></div></div>
          <label class="switch"><input type="checkbox" id="privacy-keyring" aria-labelledby="privacy-keyring-label"><span></span></label>
        </div>
        <div class="toggle">
          <div><div class="label" id="privacy-history-label" data-i18n="privacy_history"></div><div class="desc" data-i18n="privacy_history_hint"></div></div>
          <label class="switch"><input type="checkbox" id="privacy-history" aria-labelledby="privacy-history-label"><span></span></label>
        </div>
        <details class="data-flow">
          <summary data-i18n="data_flow_title"></summary>
          <ul class="small">
            <li data-i18n="data_flow_discovery"></li>
            <li data-i18n="data_flow_transfers"></li>
            <li data-i18n="data_flow_internet"></li>
            <li data-i18n="data_flow_storage"></li>
            <li data-i18n="data_flow_telemetry"></li>
          </ul>
        </details>
      </div>
      <div class="group-title" data-i18n="section_app"></div>
      <div class="group">
        <div class="field"><label for="language" data-i18n="language"></label><select id="language"></select></div>
        <div class="field"><label for="network-mode" data-i18n="network_mode"></label>
          <select id="network-mode">
            <option value="local" data-i18n="network_local"></option>
            <option value="internet" data-i18n="network_internet"></option>
            <option value="relay" data-i18n="network_relay"></option>
          </select>
          <div class="muted small" id="network-desc"></div>
          <div class="relay-field" id="relay-field" hidden>
            <label for="relay-urls" class="small" data-i18n="relay_urls"></label>
            <textarea id="relay-urls" rows="2" spellcheck="false" autocomplete="off" data-i18n-ph="relay_urls_ph"></textarea>
            <button id="btn-relay-save" data-i18n="relay_save"></button>
          </div>
          <div class="toggle" id="network-pending" hidden>
            <div class="small" style="color: var(--warn)" data-i18n="network_restart"></div>
            <button class="desktop-only" id="btn-restart" data-i18n="restart_now"></button>
          </div>
        </div>
        <div class="about">
          <span class="logo"><svg class="i"><use href="#i-logo"/></svg></span>
          <div style="flex:1; min-width:0"><div style="font-weight:600" id="about-version">Ferry</div><div class="muted small" data-i18n="about_text"></div></div>
          <button class="desktop-only" id="btn-repo"><svg class="i sm"><use href="#i-code"/></svg><span data-i18n="source_code"></span></button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-restart" role="alertdialog" aria-modal="true" aria-labelledby="restart-title">
  <div class="modal">
    <div class="modal-head"><h3 id="restart-title" data-i18n="restart_title"></h3></div>
    <div class="modal-body">
      <p class="desktop-only" data-i18n="restart_text"></p>
      <p class="mobile-only" data-i18n="restart_text_mobile"></p>
      <div class="modal-actions">
        <button id="btn-restart-later" data-i18n="restart_later"></button>
        <button class="primary desktop-only" id="btn-restart-ok" data-i18n="ok"></button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- Announces finished transfers to screen readers without reading every progress update. -->
<div class="sr-only" id="sr-status" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
