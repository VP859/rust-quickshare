<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RQS P2P Quick Share</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --card-2: #273449; --border: #334155;
    --accent: #38bdf8; --accent-strong: #0284c7; --text: #f8fafc; --muted: #94a3b8;
    --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444; --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f1f5f9; --card: #ffffff; --card-2: #e2e8f0; --border: #cbd5e1;
      --accent: #0284c7; --accent-strong: #0369a1; --text: #0f172a; --muted: #3b485a; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); -webkit-user-select: none; user-select: none; }
  .container { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  button { font: inherit; cursor: pointer; border: none; border-radius: 8px; padding: 9px 14px; color: var(--text); background: var(--card-2); }
  button:hover { filter: brightness(1.12); }
  button:focus-visible, input:focus-visible, .peer-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #00131f; font-weight: 600; }
  button.danger { background: transparent; color: var(--bad); }
  button.ghost { background: transparent; color: var(--muted); padding: 6px 8px; }
  h1 { font-size: 1.25rem; } h2 { font-size: 1.05rem; } h3 { font-size: 1rem; }
  .muted { color: var(--muted); font-size: .85rem; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; word-break: break-all; -webkit-user-select: text; user-select: text; }

  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.wait { background: var(--warn); }
  .header-actions { display: flex; gap: 8px; }

  .dropzone { border: 2px dashed var(--border); background: var(--card); border-radius: var(--radius); padding: 30px 20px; text-align: center; transition: border-color .15s, background .15s; }
  .dropzone.drag-over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
  .dropzone .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .peer-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; position: relative; cursor: pointer; transition: border-color .15s, transform .1s; }
  .peer-card:hover, .peer-card.drag-over { border-color: var(--accent); }
  .peer-card.drag-over { transform: scale(1.02); }
  .peer-card .title { display: flex; align-items: center; gap: 8px; font-weight: 600; padding-right: 28px; overflow: hidden; }
  .peer-card .title span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .peer-card .node-id { font-size: .72rem; color: var(--muted); margin-top: 6px; }
  .peer-card .meta { font-size: .75rem; color: var(--muted); margin-top: 8px; }
  .peer-card .badge { color: var(--ok); }
  .card-menu-btn { position: absolute; top: 6px; right: 6px; }
  .menu { position: absolute; top: 36px; right: 6px; background: var(--card-2); border: 1px solid var(--border); border-radius: 8px; padding: 4px; z-index: 20; min-width: 190px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .menu button { display: block; width: 100%; text-align: left; background: transparent; padding: 8px 10px; }
  .menu button:hover { background: var(--border); }
  .empty { color: var(--muted); font-size: .85rem; padding: 6px 0; }

  .transfer { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
  .transfer .row { display: flex; justify-content: space-between; gap: 10px; font-size: .85rem; }
  .transfer .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; background: var(--card-2); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .transfer.done .bar > div { background: var(--ok); } .transfer.failed .bar > div { background: var(--bad); }
  .transfers { display: grid; gap: 8px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; justify-content: center; align-items: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 100; }
  .modal-overlay.active { opacity: 1; pointer-events: all; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; max-width: 460px; max-height: 90vh; overflow: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: .85rem; color: var(--muted); }
  .field input[type=text], .field textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; font: inherit; -webkit-user-select: text; user-select: text; }
  .field select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; font: inherit; }
  .field textarea { resize: vertical; min-height: 70px; font-family: ui-monospace, monospace; font-size: .8rem; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--border); border-radius: 12px; transition: background .15s; cursor: pointer; }
  .switch span::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::before { transform: translateX(20px); }
  .qr { background: #fff; border-radius: 10px; padding: 10px; align-self: center; width: min(260px, 100%); }
  .qr svg { width: 100%; height: auto; display: block; }
  .ticket-box { background: var(--bg); border: 1px solid var(--border); padding: 10px; border-radius: 8px; font-size: .75rem; max-height: 90px; overflow: auto; }
  .recipient { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px; background: var(--card-2); }
  .recipient .grow { flex: 1; overflow: hidden; }
  .recipient .grow div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recipients { display: grid; gap: 8px; }

  .toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 120px); background: var(--card-2); border: 1px solid var(--accent); padding: 12px 18px; border-radius: 8px; max-width: calc(100vw - 32px); transition: transform .25s; z-index: 200; font-size: .9rem; }
  .toast.visible { transform: translate(-50%, 0); }
  .toast.error { border-color: var(--bad); }
  .pair-code { font: 600 2rem ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .12em; text-align: center; padding: 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; -webkit-user-select: text; user-select: text; }
  .card-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .card-actions button { padding: 7px 12px; }
  .section-hint { margin: -4px 0 10px; }
  .recipients .group { font-size: .78rem; color: var(--muted); margin-top: 6px; }
  .mobile-only { display: none; }
  body.mobile .mobile-only { display: inline-block; }
  body.mobile .desktop-only { display: none !important; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>RQS P2P Quick Share</h1>
      <span class="status"><span class="dot wait" id="node-dot"></span><span id="node-status"></span></span>
    </div>
    <div class="header-actions">
      <button id="btn-my-ticket" data-i18n="my_ticket"></button>
      <button id="btn-settings" data-i18n-aria="settings">⚙</button>
    </div>
  </header>

  <section class="dropzone" id="dropzone">
    <h2 class="desktop-only" data-i18n="drop_here"></h2>
    <h2 class="mobile-only" data-i18n="send_files"></h2>
    <p class="muted" style="margin-top:6px" data-i18n="drop_hint"></p>
    <div class="actions">
      <button class="primary" id="btn-select-file" data-i18n="select_file"></button>
      <button class="mobile-only" id="btn-scan" data-i18n="scan_qr"></button>
      <button id="btn-receive-ticket" data-i18n="receive_ticket"></button>
    </div>
  </section>

  <section>
    <div class="section-header">
      <h2 data-i18n="nearby"></h2>
      <button id="btn-nearby-refresh" data-i18n="search"></button>
    </div>
    <p class="muted section-hint" data-i18n="nearby_hint"></p>
    <div class="grid" id="nearby"></div>
  </section>

  <section>
    <div class="section-header">
      <h2 data-i18n="trusted"></h2>
      <button class="primary" id="btn-add-peer" data-i18n="add_device_btn"></button>
    </div>
    <div class="grid" id="peers"></div>
  </section>

  <section>
    <div class="section-header"><h2 data-i18n="transfers"></h2><button class="ghost" id="btn-clear" data-i18n="clear_finished"></button></div>
    <div class="transfers" id="transfers"></div>
  </section>
</div>

<div class="modal-overlay" id="modal-peer" role="dialog" aria-modal="true" aria-labelledby="peer-title">
  <div class="modal">
    <h3 id="peer-title"></h3>
    <div class="field" id="peer-input-field">
      <label for="peer-input" data-i18n="ticket_or_id"></label>
      <textarea id="peer-input" data-i18n-ph="ticket_or_id_ph"></textarea>
      <button class="mobile-only" id="btn-peer-scan" style="align-self:flex-start" data-i18n="scan_qr"></button>
    </div>
    <div class="field">
      <label for="peer-alias" data-i18n="alias"></label>
      <input type="text" id="peer-alias" data-i18n-ph="alias_ph" maxlength="60">
    </div>
    <div class="toggle">
      <div><div>Auto-Accept</div><div class="muted" data-i18n="auto_accept_hint"></div></div>
      <label class="switch"><input type="checkbox" id="peer-auto"><span></span></label>
    </div>
    <p class="muted" id="peer-pair-hint" data-i18n="pair_after_add_hint"></p>
    <div class="modal-actions">
      <button id="btn-peer-cancel" data-i18n="cancel"></button>
      <button class="primary" id="btn-peer-save" data-i18n="save"></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-recipient" role="dialog" aria-modal="true" aria-labelledby="recipient-title">
  <div class="modal">
    <h3 id="recipient-title" data-i18n="choose_recipient"></h3>
    <p class="muted" id="recipient-files"></p>
    <div class="recipients" id="recipients"></div>
    <button id="btn-share-ticket" data-i18n="share_by_ticket"></button>
    <div class="modal-actions"><button id="btn-recipient-cancel" data-i18n="cancel"></button></div>
  </div>
</div>

<div class="modal-overlay" id="modal-ticket" role="dialog" aria-modal="true" aria-labelledby="ticket-title">
  <div class="modal">
    <h3 id="ticket-title">TICKET</h3>
    <p class="muted" id="ticket-desc"></p>
    <div class="qr" id="ticket-qr"></div>
    <div class="ticket-box mono" id="ticket-text"></div>
    <div class="modal-actions">
      <button class="primary" id="btn-ticket-copy" data-i18n="copy"></button>
      <button id="btn-ticket-close" data-i18n="close"></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-receive" role="dialog" aria-modal="true" aria-labelledby="receive-title">
  <div class="modal">
    <h3 id="receive-title" data-i18n="receive_title"></h3>
    <div class="field"><label for="receive-input" data-i18n="share_ticket"></label><textarea id="receive-input" placeholder="rqs:…"></textarea></div>
    <div class="modal-actions"><button id="btn-receive-cancel" data-i18n="cancel"></button><button class="primary" id="btn-receive-go" data-i18n="download"></button></div>
  </div>
</div>

<div class="modal-overlay" id="modal-offer" role="alertdialog" aria-modal="true" aria-labelledby="offer-title">
  <div class="modal">
    <h3 id="offer-title" data-i18n="incoming_file"></h3>
    <div><div style="font-weight:600" id="offer-file"></div><div class="muted" id="offer-meta"></div></div>
    <p class="muted" id="offer-queue"></p>
    <div class="modal-actions"><button class="danger" id="btn-offer-reject" data-i18n="reject"></button><button class="primary" id="btn-offer-accept" data-i18n="accept"></button></div>
  </div>
</div>

<div class="modal-overlay" id="modal-pairing" role="dialog" aria-modal="true" aria-labelledby="pairing-title">
  <div class="modal">
    <h3 id="pairing-title"></h3>
    <p class="muted" data-i18n="pairing_confirm_hint"></p>
    <div class="pair-code" id="pairing-code"></div>
    <p class="muted" id="pairing-status" role="status"></p>
    <div class="modal-actions"><button id="btn-pairing-close" data-i18n="close"></button></div>
  </div>
</div>

<div class="modal-overlay" id="modal-pair-request" role="alertdialog" aria-modal="true" aria-labelledby="pair-req-title">
  <div class="modal">
    <h3 id="pair-req-title" data-i18n="pair_request"></h3>
    <p><strong id="pair-req-name"></strong> <span data-i18n="pair_request_text"></span></p>
    <p class="muted" data-i18n="pair_request_hint"></p>
    <div class="pair-code" id="pair-req-code"></div>
    <p class="muted" id="pair-req-queue"></p>
    <div class="modal-actions"><button class="danger" id="btn-pair-reject" data-i18n="reject"></button><button class="primary" id="btn-pair-accept" data-i18n="pair"></button></div>
  </div>
</div>

<div class="modal-overlay" id="modal-settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="modal">
    <h3 id="settings-title" data-i18n="settings"></h3>
    <div class="field"><label for="device-name" data-i18n="device_name"></label>
      <div style="display:flex; gap:8px"><input type="text" id="device-name" maxlength="64" style="flex:1; min-width:0"><button id="btn-device-name-save" data-i18n="save"></button></div></div>
    <div class="field"><label for="language" data-i18n="language"></label><select id="language"></select></div>
    <div class="field"><label data-i18n="node_id_label"></label><div class="ticket-box mono" id="settings-node"></div></div>
    <div class="field"><label data-i18n="download_dir"></label><div class="ticket-box mono" id="settings-dir"></div>
      <button class="desktop-only" id="btn-change-dir" style="align-self:flex-start" data-i18n="change_dir"></button></div>
    <div class="toggle desktop-only">
      <div><div data-i18n="autostart"></div><div class="muted" data-i18n="autostart_hint"></div></div>
      <label class="switch"><input type="checkbox" id="autostart"><span></span></label>
    </div>
    <div class="modal-actions"><button id="btn-settings-close" data-i18n="close"></button></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

  let lang = 'en';
  function t(key, vars = {}) {
    const v = I18N[lang]?.[key] ?? I18N.en[key] ?? key;
    return typeof v === 'function' ? v(vars) : v.replace(/\{(\w+)\}/g, (m, k) => k in vars ? String(vars[k]) : m);
  }
  function applyStaticText() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(e => { e.placeholder = t(e.dataset.i18nPh); });
    document.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', t(e.dataset.i18nAria)); });

  // ---------- Helpers ----------
  let toastTimer;
  function toast(msg, isError = false) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.toggle('error', isError);
    el.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('visible'), isError ? 6000 : 3000);
  }
  const fail = (e) => toast(String(e?.message ?? e), true);
  const fmtSize = (b) => b >= 1 << 30 ? (b / (1 << 30)).toFixed(2) + ' GB' : b >= 1 << 20 ? (b / (1 << 20)).toFixed(1) + ' MB' : b >= 1024 ? (b / 1024).toFixed(0) + ' KB' : b + ' B';
  const baseName = (p) => decodeURIComponent(String(p).split(/[\\/]/).pop() || p);
  const shortId = (id) => id.slice(0, 10) + '…';
  function el(tag, props = {}, ...children) {
    const e = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => k === 'class' ? e.className = v : k.startsWith('on') ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v));
    children.flat().forEach(c => e.append(c instanceof Node ? c : document.createTextNode(String(c))));
    return e;
  }
  const open = (id) => $(id).classList.add('active');
  const close = (id) => $(id).classList.remove('active');
  document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', (e) => { if (e.target === m && m.getAttribute('role') !== 'alertdialog') close(m.id); }));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.active:not([role=alertdialog])').forEach(m => close(m.id)); });

  async function copyText(text) {
    try {
      if (T?.clipboardManager?.writeText) await T.clipboardManager.writeText(text);
      else await invoke('plugin:clipboard-manager|write_text', { text });
    } catch { await navigator.clipboard.writeText(text); }
    toast(t('copied'));
  }

  async function pickFiles() {
    const opts = { multiple: true, directory: false };
    const res = T?.dialog?.open ? await T.dialog.open(opts) : await invoke('plugin:dialog|open', { options: opts });
    if (!res) return [];
    return (Array.isArray(res) ? res : [res]).map(f => typeof f === 'string' ? f : f.path ?? f.uri ?? String(f));
  }

  async function scanQr() {
    const opts = { windowed: false, formats: ['QR_CODE'] };
    const res = T?.barcodeScanner?.scan ? await T.barcodeScanner.scan(opts) : await invoke('plugin:barcode-scanner|scan', opts);
    return res?.content?.trim();
  }

  // ---------- Node ----------
  let nodeInfo = null;
  let nodeState = 'starting';
  function renderNodeStatus() {
    $('node-dot').className = 'dot ' + (nodeState === 'ok' ? 'ok' : nodeState === 'bad' ? 'bad' : 'wait');
    $('node-status').textContent = nodeState === 'ok' ? t('node_active', { id: shortId(nodeInfo.node_id) })
      : nodeState === 'bad' ? t('node_unavailable') : t('node_starting');
  }
  async function loadNodeInfo() {
    try {
      nodeInfo = await invoke('get_node_info');
      nodeState = 'ok';
    } catch (e) {
      nodeState = 'bad';
      fail(e);
    }
    renderNodeStatus();
  }

  function showTicket(title, desc, ticket, svg) {
    $('ticket-title').textContent = title;
    $('ticket-desc').textContent = desc;
    $('ticket-qr').innerHTML = svg; // generated by the backend (qrcode crate), never user input
    $('ticket-text').textContent = ticket;
    open('modal-ticket');
  }
  $('btn-my-ticket').onclick = async () => {
    if (!nodeInfo) await loadNodeInfo();
    if (nodeInfo) showTicket(t('own_ticket_title'), t('own_ticket_desc'), nodeInfo.ticket, nodeInfo.qr_svg);
  };
  $('btn-ticket-copy').onclick = () => copyText($('ticket-text').textContent);
  $('btn-ticket-close').onclick = () => close('modal-ticket');

  // ---------- Trusted devices ----------
  let peers = [];
  const online = new Map();
  let openMenu = null;
  document.addEventListener('click', () => { openMenu?.remove(); openMenu = null; });

  async function refreshPeers() {
    try { peers = await invoke('list_peers'); } catch (e) { fail(e); peers = []; }
    renderPeers();
  }

  function renderPeers() {
    const box = $('peers');
    box.replaceChildren();
    if (!peers.length) {
      box.append(el('p', { class: 'empty' }, t('no_peers')));
      return;
    }
    for (const p of peers) {
      const state = online.get(p.node_id);
      const dot = el('span', { class: 'dot ' + (state === true ? 'ok' : state === false ? 'bad' : 'wait') });
      const menuBtn = el('button', { class: 'ghost card-menu-btn', 'aria-label': t('device_options'), onclick: (e) => { e.stopPropagation(); showMenu(card, p); } }, '⋮');
      const card = el('div', { class: 'peer-card', tabindex: '0', 'data-node': p.node_id, role: 'button',
          'aria-label': t('send_to', { name: p.alias }),
          onclick: () => sendToPeer(p),
          onkeydown: (e) => { if (e.key === 'Enter') sendToPeer(p); } },
        menuBtn,
        el('div', { class: 'title' }, dot, el('span', {}, p.alias)),
        el('div', { class: 'node-id mono' }, p.node_id),
        el('div', { class: 'meta' },
          state === true ? t('peer_online') : state === false ? t('peer_offline') : t('peer_checking'),
          p.auto_accept ? el('span', { class: 'badge' }, ' · Auto-Accept') : ''));
      box.append(card);
    }
  }

  async function checkOnline() {
    await Promise.all(peers.map(async (p) => {
      try { online.set(p.node_id, await invoke('peer_online', { nodeId: p.node_id })); }
      catch { online.set(p.node_id, false); }
      renderPeers();
    }));
  }

  function showMenu(card, p) {
    openMenu?.remove();
    const item = (label, fn, cls = '') => el('button', { class: cls, onclick: async (e) => { e.stopPropagation(); openMenu?.remove(); openMenu = null; try { await fn(); } catch (err) { fail(err); } } }, label);
    openMenu = el('div', { class: 'menu', onclick: (e) => e.stopPropagation() },
      item(t('send_file_menu'), () => sendToPeer(p)),
      item(t('edit_peer'), () => openPeerModal(p)),
      item(p.auto_accept ? t('auto_accept_off') : t('auto_accept_on'), async () => {
        await invoke('update_peer', { nodeId: p.node_id, alias: null, autoAccept: !p.auto_accept });
        await refreshPeers();
        toast(t(p.auto_accept ? 'auto_accept_disabled' : 'auto_accept_enabled', { name: p.alias }));
      }),
      item(t('copy_node_id'), () => copyText(p.node_id)),
      item(t('remove_device'), async () => {
        if (!confirm(t('confirm_remove', { name: p.alias }))) return;
        await invoke('remove_peer', { nodeId: p.node_id });
        online.delete(p.node_id);
        await refreshPeers();
        toast(t('device_removed'));
      }, 'danger'));
    card.append(openMenu);
  }

  let editing = null;
  function openPeerModal(peer = null, prefill = '') {
    editing = peer;
    $('peer-title').textContent = peer ? t('edit_title', { name: peer.alias }) : t('add_device');
    $('peer-input-field').style.display = peer ? 'none' : '';
    $('peer-pair-hint').style.display = peer ? 'none' : '';
    $('peer-input').value = prefill;
    $('peer-alias').value = peer?.alias ?? '';
    $('peer-auto').checked = peer?.auto_accept ?? false;
    open('modal-peer');
    (peer ? $('peer-alias') : $('peer-input')).focus();
  }
  $('btn-add-peer').onclick = () => openPeerModal();
  $('btn-peer-cancel').onclick = () => close('modal-peer');
  $('btn-peer-scan').onclick = async () => { try { const v = await scanQr(); if (v) $('peer-input').value = v; } catch (e) { fail(e); } };
  $('btn-peer-save').onclick = async () => {
    const alias = $('peer-alias').value.trim();
    const autoAccept = $('peer-auto').checked;
    try {
      if (editing) {
        await invoke('update_peer', { nodeId: editing.node_id, alias, autoAccept });
        toast(t('changes_saved'));
      } else {
        const input = $('peer-input').value.trim();
        if (!input) return toast(t('paste_ticket'), true);
        const id = await invoke('add_peer', { input, alias, autoAccept });
        online.delete(id);
        toast(t('device_added'));
      }
      close('modal-peer');
      await refreshPeers();
      checkOnline();
    } catch (e) { fail(e); }
  };

  // ---------- Nearby devices and pairing ----------
  let nearby = [];
  const PLATFORMS = { linux: 'Linux', windows: 'Windows', macos: 'macOS', android: 'Android', ios: 'iOS' };
  const platformLabel = (p) => PLATFORMS[p] ?? p;
  const isTrusted = (id) => peers.some(p => p.node_id === id);

  function setNearby(list) {
    nearby = list || [];
    for (const d of nearby) if (isTrusted(d.node_id)) online.set(d.node_id, true);
    renderNearby();
    renderPeers();
  }

  function renderNearby() {
    const box = $('nearby');
    box.replaceChildren();
    if (!nearby.length) {
      const hint = el('p', { class: 'empty', style: 'color: var(--warn)' });
      box.append(el('p', { class: 'empty' }, t('searching_nearby')), hint);
      invoke('discovery_health').then(h => { if (h) hint.textContent = h; }).catch(() => {});
      return;
    }
    for (const d of nearby) {
      const peer = peers.find(p => p.node_id === d.node_id);
      const send = el('button', { onclick: (e) => { e.stopPropagation(); sendToDevice(d.node_id, peer?.alias ?? d.name); } }, t('send_file'));
      const actions = peer
        ? el('div', { class: 'card-actions' }, send)
        : el('div', { class: 'card-actions' },
            el('button', { class: 'primary', onclick: (e) => { e.stopPropagation(); pairWith(d); } }, t('pair')), send);
      box.append(el('div', { class: 'peer-card', 'data-node': d.node_id },
        el('div', { class: 'title' }, el('span', { class: 'dot ok' }), el('span', {}, d.name)),
        el('div', { class: 'meta' }, platformLabel(d.platform), peer ? el('span', { class: 'badge' }, t('paired_as', { name: peer.alias })) : ''),
        el('div', { class: 'node-id mono' }, shortId(d.node_id)),
        actions));
    }
  }

  async function sendToDevice(nodeId, label) {
    try { await sendFiles(await pickFiles(), nodeId, label); } catch (e) { fail(e); }
  }

  let pairingWith = null;
  async function pairWith(d) {
    try {
      pairingWith = d.node_id;
      $('pairing-title').textContent = t('pairing_with', { name: d.name });
      $('pairing-code').textContent = await invoke('pair_code', { nodeId: d.node_id });
      $('pairing-status').textContent = t('waiting_confirmation');
      open('modal-pairing');
      const alias = await invoke('pair_device', { nodeId: d.node_id });
      await refreshPeers();
      renderNearby();
      if (pairingWith === d.node_id) {
        $('pairing-status').textContent = t('paired_status', { name: alias });
        setTimeout(() => close('modal-pairing'), 1500);
      }
      toast(t('paired_with', { name: alias }));
    } catch (e) {
      if (pairingWith === d.node_id) $('pairing-status').textContent = t('not_paired', { error: String(e?.message ?? e) });
      else fail(e);
    }
  }
  $('btn-pairing-close').onclick = () => { pairingWith = null; close('modal-pairing'); };
  $('btn-nearby-refresh').onclick = async () => {
    try { await invoke('refresh_nearby'); toast(t('searching')); } catch (e) { fail(e); }
  };

  const pairRequests = [];
  function showNextPairRequest() {
    const r = pairRequests[0];
    if (!r) return close('modal-pair-request');
    $('pair-req-name').textContent = r.name;
    $('pair-req-code').textContent = r.code;
    $('pair-req-queue').textContent = pairRequests.length > 1 ? t('queued', { n: pairRequests.length - 1 }) : '';
    open('modal-pair-request');
  }
  async function answerPairRequest(accept) {
    const r = pairRequests.shift();
    if (r) {
      try {
        await invoke('respond_to_offer', { transferId: r.id, accept });
        if (accept) toast(t('paired_with', { name: r.name }));
      } catch (e) { fail(e); }
    }
    showNextPairRequest();
  }
  $('btn-pair-accept').onclick = () => answerPairRequest(true);
  $('btn-pair-reject').onclick = () => answerPairRequest(false);

  /** The Android host name is "localhost", so the phone model is used as the default device name. */
  async function detectDeviceModel() {
    try {
      const v = await navigator.userAgentData?.getHighEntropyValues?.(['model']);
      if (v?.model) return v.model;
    } catch {}
    const m = navigator.userAgent.match(/Android [^;]+; ([^;)]+)[;)]/);
    const model = m?.[1]?.trim();
    return model && model !== 'K' && model !== 'wv' ? model : null;
  }
  async function ensureDeviceName() {
    try {
      const dn = await invoke('get_device_name');
      if (dn.is_default && isMobile) {
        const model = await detectDeviceModel();
        if (model) await invoke('set_device_name', { name: model });
      }
    } catch (e) { console.warn('Device name:', e); }
  }

  // ---------- Sending ----------
  async function sendFiles(paths, target, label) {
    if (!paths.length) return;
    try {
      await invoke('send_files', { paths, target });
      const what = paths.length > 1 ? t('n_files', { n: paths.length }) : baseName(paths[0]);
      toast(t('sending', { what, name: label }));
    } catch (e) { fail(e); }
  }

  async function sendToPeer(p) {
    try { await sendFiles(await pickFiles(), p.node_id, p.alias); } catch (e) { fail(e); }
  }

  let pendingFiles = [];
  function chooseRecipient(paths) {
    if (!paths.length) return;
    pendingFiles = paths;
    $('recipient-files').textContent = paths.length === 1 ? baseName(paths[0]) : t('n_files_list', { n: paths.length, list: paths.map(baseName).join(', ') });
    const box = $('recipients');
    box.replaceChildren();
    const unpaired = nearby.filter(d => !isTrusted(d.node_id));
    if (!peers.length && !unpaired.length) box.append(el('p', { class: 'empty' }, t('no_devices')));
    for (const p of peers) {
      const state = online.get(p.node_id);
      box.append(el('button', { class: 'recipient', onclick: () => { close('modal-recipient'); sendFiles(pendingFiles, p.node_id, p.alias); } },
        el('span', { class: 'dot ' + (state === true ? 'ok' : state === false ? 'bad' : 'wait') }),
        el('div', { class: 'grow' }, el('div', {}, p.alias), el('div', { class: 'muted mono' }, shortId(p.node_id)))));
    }
    if (unpaired.length) box.append(el('div', { class: 'group' }, t('nearby_unpaired')));
    for (const d of unpaired) {
      box.append(el('button', { class: 'recipient', onclick: () => { close('modal-recipient'); sendFiles(pendingFiles, d.node_id, d.name); } },
        el('span', { class: 'dot ok' }),
        el('div', { class: 'grow' }, el('div', {}, d.name), el('div', { class: 'muted' }, platformLabel(d.platform)))));
    }
    $('btn-share-ticket').disabled = paths.length !== 1;
    $('btn-share-ticket').title = paths.length !== 1 ? t('ticket_one_file') : '';
    open('modal-recipient');
  }
  $('btn-recipient-cancel').onclick = () => close('modal-recipient');
  $('btn-share-ticket').onclick = async () => {
    close('modal-recipient');
    try {
      const s = await invoke('share_file', { path: pendingFiles[0] });
      showTicket(t('shared_title', { name: s.file_name }), t('shared_desc'), s.ticket, s.qr_svg);
    } catch (e) { fail(e); }
  };
  $('btn-select-file').onclick = async () => { try { chooseRecipient(await pickFiles()); } catch (e) { fail(e); } };

  // ---------- Receiving from a TICKET / QR code ----------
  async function handleScannedTicket(text) {
    if (!text) return;
    const info = await invoke('inspect_ticket', { ticket: text });
    if (info.has_share) {
      await invoke('receive_from_ticket', { ticket: text });
      toast(t('downloading'));
    } else {
      openPeerModal(null, text);
    }
  }
  $('btn-scan').onclick = async () => { try { await handleScannedTicket(await scanQr()); } catch (e) { fail(e); } };
  $('btn-receive-ticket').onclick = () => { $('receive-input').value = ''; open('modal-receive'); $('receive-input').focus(); };
  $('btn-receive-cancel').onclick = () => close('modal-receive');
  $('btn-receive-go').onclick = async () => {
    try { await handleScannedTicket($('receive-input').value.trim()); close('modal-receive'); } catch (e) { fail(e); }
  };

  // ---------- Native drag and drop (Tauri) ----------
  function targetAt(pos) {
    if (!pos) return null;
    const ratio = window.devicePixelRatio || 1;
    const node = document.elementFromPoint(pos.x / ratio, pos.y / ratio);
    return node?.closest('.peer-card') || node?.closest('#dropzone') || null;
  }
  let hovered = null;
  function setHover(target) {
    if (hovered === target) return;
    hovered?.classList.remove('drag-over');
    hovered = target;
    hovered?.classList.add('drag-over');
  }
  async function setupDragDrop() {
    const webview = T?.webview?.getCurrentWebview?.();
    if (!webview?.onDragDropEvent) return;
    await webview.onDragDropEvent(({ payload }) => {
      if (payload.type === 'enter' || payload.type === 'over') {
        setHover(targetAt(payload.position) || $('dropzone'));
      } else if (payload.type === 'drop') {
        const target = targetAt(payload.position);
        setHover(null);
        const paths = payload.paths || [];
        const id = target?.dataset?.node;
        const peer = id && peers.find(p => p.node_id === id);
        const device = id && nearby.find(d => d.node_id === id);
        if (peer) sendFiles(paths, peer.node_id, peer.alias);
        else if (device) sendFiles(paths, device.node_id, device.name);
        else chooseRecipient(paths);
      } else {
        setHover(null);
      }
    });
  }

  // ---------- Transfers ----------
  const transfers = new Map();
  function renderTransfer(ev) {
    let row = transfers.get(ev.id);
    if (!row) {
      row = { el: el('div', { class: 'transfer' }) };
      transfers.set(ev.id, row);
      const list = $('transfers');
      list.querySelector('.empty')?.remove();
      list.prepend(row.el);
    }
    row.ev = ev;
    const kind = ev.status.kind;
    const pct = ev.total ? Math.min(100, Math.round(ev.done / ev.total * 100)) : (kind === 'completed' ? 100 : 0);
    const peer = peers.find(p => p.node_id === ev.peer)?.alias ?? shortId(ev.peer);
    const detail = kind === 'running' ? `${pct}% · ${fmtSize(ev.done)} / ${fmtSize(ev.total)}`
      : kind === 'failed' ? t('tr_failed', { error: ev.status.error }) : kind === 'rejected' ? t('tr_rejected', { reason: ev.status.reason })
      : kind === 'completed' && ev.status.path ? t('tr_saved', { path: ev.status.path }) : t('st_' + kind);
    row.el.className = 'transfer' + (kind === 'completed' ? ' done' : kind === 'failed' || kind === 'rejected' ? ' failed' : '');
    const bar = el('div', { class: 'bar' }, el('div'));
    bar.firstChild.style.width = pct + '%';
    const parts = [
      el('div', { class: 'row' }, el('span', { class: 'name' }, (ev.direction === 'upload' ? '↑ ' : '↓ ') + ev.file_name), el('span', { class: 'muted' }, peer)),
      bar,
      el('div', { class: 'muted', style: 'word-break: break-all' }, detail)];
    if (kind === 'completed' && ev.direction === 'download' && ev.status.path && !isMobile) {
      const openFile = (reveal) => invoke('open_received', { path: ev.status.path, reveal }).catch(fail);
      parts.push(el('div', { class: 'card-actions' },
        el('button', { onclick: () => openFile(false) }, t('open')),
        el('button', { onclick: () => openFile(true) }, t('show_in_folder'))));
    }
    row.el.replaceChildren(...parts);
  }
  function renderNoTransfers() {
    if (!transfers.size) $('transfers').replaceChildren(el('p', { class: 'empty' }, t('no_transfers')));
  }
  $('btn-clear').onclick = () => {
    for (const [id, row] of transfers) {
      if (['completed', 'failed', 'rejected'].includes(row.ev.status.kind)) { row.el.remove(); transfers.delete(id); }
    }
    renderNoTransfers();
  };

  // ---------- Incoming offers ----------
  const offers = [];
  function showNextOffer() {
    const o = offers[0];
    if (!o) return close('modal-offer');
    $('offer-file').textContent = o.file_name;
    $('offer-meta').textContent = t('from', { size: fmtSize(o.size), name: o.alias ?? t('unknown_device', { id: shortId(o.peer) }) });
    $('offer-queue').textContent = offers.length > 1 ? t('queued', { n: offers.length - 1 }) : '';
    open('modal-offer');
  }
  async function answerOffer(accept) {
    const o = offers.shift();
    if (o) { try { await invoke('respond_to_offer', { transferId: o.id, accept }); } catch (e) { fail(e); } }
    showNextOffer();
  }
  $('btn-offer-accept').onclick = () => answerOffer(true);
  $('btn-offer-reject').onclick = () => answerOffer(false);

  // ---------- Language ----------
  function rerender() {
    applyStaticText();
    renderNodeStatus();
    renderPeers();
    renderNearby();
    for (const row of transfers.values()) renderTransfer(row.ev);
    renderNoTransfers();
    if (offers.length) showNextOffer();
    if (pairRequests.length) showNextPairRequest();
  }
  async function loadLanguage() {
    try {
      const info = await invoke('get_language');
      lang = info.code;
      $('language').replaceChildren(...info.available.map(l => el('option', { value: l.code }, l.name)));
      $('language').value = lang;
    } catch (e) { console.warn('Language:', e); }
  }
  $('language').onchange = async (e) => {
    try {
      lang = await invoke('set_language', { code: e.target.value });
      rerender();
    } catch (err) { e.target.value = lang; fail(err); }
  };

  // ---------- Settings ----------
  $('btn-settings').onclick = async () => {
    if (!nodeInfo) await loadNodeInfo();
    $('settings-node').textContent = nodeInfo?.node_id ?? '—';
    try { $('device-name').value = (await invoke('get_device_name')).name; } catch {}
    $('settings-dir').textContent = nodeInfo?.download_dir ?? '—';
    $('language').value = lang;
    if (!isMobile) { try { $('autostart').checked = await invoke('plugin:autostart|is_enabled'); } catch {} }
    open('modal-settings');
  };
  $('btn-settings-close').onclick = () => close('modal-settings');
  $('btn-device-name-save').onclick = async () => {
    try { $('device-name').value = await invoke('set_device_name', { name: $('device-name').value }); toast(t('name_saved')); }
    catch (e) { fail(e); }
  };
  $('autostart').onchange = async (e) => {
    try { await invoke(e.target.checked ? 'plugin:autostart|enable' : 'plugin:autostart|disable'); toast(t('saved')); }
    catch (err) { e.target.checked = !e.target.checked; fail(err); }
  };
  $('btn-change-dir').onclick = async () => {
    try {
      const dir = T?.dialog?.open ? await T.dialog.open({ directory: true }) : await invoke('plugin:dialog|open', { options: { directory: true } });
      if (!dir) return;
      await invoke('set_download_dir', { path: String(dir) });
      await loadNodeInfo();
      $('settings-dir').textContent = nodeInfo?.download_dir ?? String(dir);
      toast(t('dir_changed'));
    } catch (e) { fail(e); }
  };

  // ---------- Android integration ----------
  async function checkSharedFiles() {
    try {
      const files = await invoke('take_shared_files');
      if (files.length) chooseRecipient(files);
    } catch (e) { fail(e); }
  }
  window.addEventListener('rqs-share', checkSharedFiles);
  window.addEventListener('rqs-lan-permission', async () => {
    try { await invoke('refresh_nearby'); toast(t('lan_granted')); }
    catch (e) { fail(e); }
  });

  // ---------- Startup ----------
  document.addEventListener('DOMContentLoaded', async () => {
    applyStaticText();
    renderNodeStatus();
    renderNoTransfers();
    if (!invoke) { toast(t('no_tauri'), true); return; }
    await loadLanguage();
    applyStaticText();
    renderNodeStatus();
    renderNoTransfers();
    await listen('transfer', ({ payload }) => renderTransfer(payload));
    await listen('transfer-error', ({ payload }) => fail(payload.message));
    await listen('incoming-offer', ({ payload }) => { offers.push(payload); if (offers.length === 1) showNextOffer(); else $('offer-queue').textContent = t('queued', { n: offers.length - 1 }); });
    await listen('node-error', ({ payload }) => fail(payload));
    await listen('nearby', ({ payload }) => setNearby(payload));
    await listen('peers-changed', async () => { await refreshPeers(); renderNearby(); });
    await listen('pair-result', async ({ payload }) => {
      toast(payload.message, !payload.ok);
      await refreshPeers();
      renderNearby();
    });
    await listen('pair-request', ({ payload }) => { pairRequests.push(payload); if (pairRequests.length === 1) showNextPairRequest(); else $('pair-req-queue').textContent = t('queued', { n: pairRequests.length - 1 }); });
    await listen('pair-cancelled', ({ payload }) => {
      const i = pairRequests.findIndex(r => r.id === payload);
      if (i < 0) return;
      pairRequests.splice(i, 1);
      if (i === 0) showNextPairRequest();
      toast(t('pair_expired'), true);
    });
    await setupDragDrop();
    await refreshPeers();
    await ensureDeviceName();
    try { setNearby(await invoke('list_nearby')); } catch {}
    await loadNodeInfo();
    checkOnline();
    setInterval(checkOnline, 60000);
    setInterval(() => { if (!nearby.length) renderNearby(); }, 5000);
    if (isMobile) checkSharedFiles();
  });
})();
</script>
</body>
</html>
