[package]
name = "rqs-gui"
version = "0.1.5"
edition = "2024"
description = "Ferry – P2P file sharing app for desktop and Android"
repository = "https://github.com/VP859/rust-quickshare"

[lib]
name = "rqs_gui_lib"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "rqs-gui"
path = "src/main.rs"

# GUI installers are built by `tauri build` (see .github/workflows/release.yml), not cargo-dist.
[package.metadata.dist]
dist = false

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
rqs_p2p = { path = ".." }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde_json = "1.0.154"
serde = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
iroh = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rust-i18n = "4.2.4"

# System tray and autostart only make sense on Linux/Windows/macOS.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
# Reading `content://` URIs returned by the Android file picker.
tauri-plugin-fs = "2.4.0"

[target.'cfg(target_os = "android")'.dependencies]
# Rust logs in `adb logcat` (stdout of an Android app is discarded).
tracing-android = "0.2.0"
# Calling MediaScannerConnection so received photos appear in the gallery.
jni = "0.21.1"
ndk-context = "0.1.1"
