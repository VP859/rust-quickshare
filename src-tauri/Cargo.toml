[package]
name = "rqs-gui"
version = "0.1.0"
edition = "2024"

[lib]
name = "rqs_gui_lib"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "rqs-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
rqs_p2p = { path = ".." }
# Uwaga: `tray-icon` to opcja właściwa wyłącznie dla desktopu – na Androidzie
# zostaje włączona warunkowo (patrz sekcja target.'cfg(not(android))' poniżej).
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
# Odczyt plików z Share Sheet (`content://…`) po stronie JS + Rust
tauri-plugin-fs = "2.4.0"
# Cykl życia aktywności Androida (onNewIntent, onResume, onDestroy)
tauri-plugin-android-lifecycle = "2.0.0"
tauri-plugin-android-lifecycle-capabilities = "2.0.0"
serde_json = "1.0.154"
blake3 = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
iroh = { workspace = true }
futures-util = "0.3"

# ---------------------------------------------------------------------------
# Zależności specyficzne dla platformy
# ---------------------------------------------------------------------------
[target.'cfg(not(target_os = "android"))'.dependencies]
# Tacka systemowa i menu kontekstowe mają sens tylko na Linux/Windows/macOS
tauri = { version = "2.12.4", features = ["tray-icon"] }

[target.'cfg(target_os = "android")'.dependencies]
# JNI do wywołań natywnych: ContentResolver, NotificationManager, WifiManager
jni = "0.21"
ndk-context = "0.1"
# Logowanie przez logcat (build.rs dodaje -llog dla native_activity_log)
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
android-tracing-layer = "0.1"
