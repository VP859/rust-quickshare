[package]
name = "rqs-gui"
version = "0.1.0"
edition = "2024"

[lib]
name = "rqs_gui_lib"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "rqs-gui"
path = "src/main.rs"

# Instalatory GUI buduje `tauri build` (patrz .github/workflows/release.yml), nie cargo-dist.
[package.metadata.dist]
dist = false

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
rqs_p2p = { path = ".." }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde_json = "1.0.154"
serde = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
iroh = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Zasobnik systemowy i autostart mają sens tylko na Linux/Windows/macOS.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
# Odczyt URI `content://` zwracanych przez okno wyboru plików na Androidzie.
tauri-plugin-fs = "2.4.0"

[target.'cfg(target_os = "android")'.dependencies]
# Logi Rusta w `adb logcat` (stdout aplikacji Android nie jest nigdzie zapisywany).
tracing-android = "0.2.0"
