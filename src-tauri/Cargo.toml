[package]
name = "ferry-gui"
description = "Ferry desktop and Android app (Tauri v2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "ferry_gui_lib"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ferry-gui"
path = "src/main.rs"

# GUI installers are built by `tauri build` (see .github/workflows/release.yml), not cargo-dist.
[package.metadata.dist]
dist = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
ferry = { path = ".." }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { workspace = true }
# Questions kept for a window opened again (`resume_ui`); on Android also the
# background limits reported by PowerHelper.kt.
serde_json = "1"
tokio = { workspace = true }
# Date in the name of a device backup.
jiff = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
iroh = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rust-i18n = "4.2.4"

# System tray and autostart only make sense on the desktop (Linux, Windows).
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
# Starting Ferry again only shows the running instance instead of a second one.
tauri-plugin-single-instance = "2"

# malloc_trim: giving the memory of an unloaded window back (platform.rs).
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

# Ending the web process of an unloaded window (lib.rs, `tray::hide_main`):
# WebKitGTK keeps it running after its web view is gone. The version wry uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_34"] }
# The minimal background process (src/background): the tray icon and the
# questions in notifications over D-Bus, the clipboard without GTK. All three
# are already used (zbus by the notification plugin and the key store,
# arboard by the clipboard plugin).
zbus = "5.19.0"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
arboard = "3.7.0"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-barcode-scanner = "2"
# Reading `content://` URIs returned by the Android file picker.
tauri-plugin-fs = "2.4.0"
# Rust logs in `adb logcat` (stdout of an Android app is discarded).
tracing-android = "0.2.0"
# Calling MediaScannerConnection so received photos appear in the gallery.
jni = "0.22.4"
ndk-context = "0.1.1"

[dev-dependencies]
tempfile = "3.27.0"
