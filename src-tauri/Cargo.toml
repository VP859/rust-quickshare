[package]
name = "ferry-gui"
description = "Ferry desktop and Android app (Tauri v2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "ferry_gui_lib"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ferry-gui"
path = "src/main.rs"

# GUI installers are built by `tauri build` (see .github/workflows/release.yml), not cargo-dist.
[package.metadata.dist]
dist = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
ferry = { path = ".." }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
iroh = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rust-i18n = "4.2.4"

# System tray and autostart only make sense on the desktop (Linux, Windows).
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-barcode-scanner = "2"
# Reading `content://` URIs returned by the Android file picker.
tauri-plugin-fs = "2.4.0"
# Rust logs in `adb logcat` (stdout of an Android app is discarded).
tracing-android = "0.2.0"
# Calling MediaScannerConnection so received photos appear in the gallery.
jni = "0.21.1"
ndk-context = "0.1.1"
